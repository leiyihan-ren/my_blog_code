<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
<!-- v17.0 模块三：全局 EventBus + DNS 预解析 / 预连接 / 主导航页预取 -->
<script src="/utils/event-bus.js"></script>
<link rel="preconnect" href="https://api.mcsrvstat.us" crossorigin>
<link rel="dns-prefetch" href="https://api.github.com">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="prefetch" href="/index.html" as="document">
<link rel="prefetch" href="/blog.html" as="document">
<link rel="prefetch" href="/drive.html" as="document">
<link rel="prefetch" href="/tools.html" as="document">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>全局播放内核 · 我的博客</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #312e81 60%, #4f46e5); color: #fff;
    }
    .card { width: min(420px, 92vw); padding: 22px 24px; border-radius: 18px;
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 18px 48px rgba(0,0,0,.28); backdrop-filter: blur(12px); }
    .kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; opacity: .65; margin-bottom: 14px; }
    #peTitle { font-size: 18px; font-weight: 700; margin: 0 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #peArtist { font-size: 12px; opacity: .7; margin: 0 0 16px; }
    #peLyric { min-height: 44px; font-size: 14px; line-height: 1.6; text-align: center; opacity: .92;
      display: flex; align-items: center; justify-content: center; }
    .bar { height: 4px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; margin: 12px 0 8px; }
    #peBar { height: 100%; width: 0%; background: #a5b4fc; border-radius: 999px; transition: width .2s linear; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    #peTime { font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }
    .ctrls { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
    button { cursor: pointer; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1);
      color: #fff; border-radius: 999px; padding: 8px 18px; font-size: 14px; transition: background .15s; }
    button:hover { background: rgba(255,255,255,.22); }
    button:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
    .hint { margin-top: 16px; font-size: 11px; line-height: 1.6; opacity: .55; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="kicker">Global Player · 全局播放内核</div>
    <h1 id="peTitle">等待主页面接入…</h1>
    <p id="peArtist">此窗口可独立存在，主页面切换不会中断播放</p>
    <div id="peLyric" aria-live="polite">♪</div>
    <div class="bar"><div id="peBar"></div></div>
    <div class="row"><span id="peTime">00:00 / 00:00</span></div>
    <div class="ctrls">
      <button type="button" id="pePrev" aria-label="上一首">⏮</button>
      <button type="button" id="pePlay" aria-label="播放或暂停">⏯</button>
      <button type="button" id="peNext" aria-label="下一首">⏭</button>
    </div>
    <p class="hint">关闭此窗口即结束全局播放；主页面导航、刷新、切标签均不影响音频。</p>
    <audio id="peAudio" preload="metadata"></audio>
  </main>
  <script src="/components/lrc.js"></script>
  <script src="/components/player-engine.js"></script>
</body>
</html>
