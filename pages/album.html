  <link rel="stylesheet" href="/styles/common.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --nav-bg: rgba(255,255,255,0.85);
      --item-bg: #f9fafb;

      --grad-cdn: linear-gradient(135deg, #f59e0b, #ef4444);

    }
    body.dark {
      --nav-bg: rgba(15,15,26,0.85);
      --item-bg: #16162a;

    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
      padding-bottom: 70px; overflow-wrap: break-word;}
    .navbar {
      background: var(--nav-bg);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid transparent;
      transition: all 0.3s var(--ease);
    }
    .navbar.scrolled {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0,0,0,0.04);
    }
    body.dark .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.2); }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb),0.3); border-radius: 4px; transition: background 0.2s var(--ease); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(var(--primary-rgb),0.5); }
    body.dark::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb),0.3); }
    body.dark::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb),0.5); }

    /* 文字选中样式 */
    ::selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
    ::-moz-selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
    body.dark ::selection { background: rgba(var(--accent-rgb),0.4); color: var(--on-accent); }
    body.dark ::-moz-selection { background: rgba(var(--accent-rgb),0.4); color: var(--on-accent); }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .logo {
      font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none;
      background: var(--grad-brand);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      transition: opacity 0.2s var(--ease);
    }
    .logo:hover { opacity: 0.85; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--text-light); text-decoration: none; font-size: 15px;
      transition: color 0.2s var(--ease); position: relative;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary-text); }
    .nav-links a.active::after {
      content: ""; position: absolute; bottom: -6px; left: 0; right: 0;
      height: 2px; background: var(--primary); border-radius: 2px;
    }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--card-bg); color: var(--text); cursor: pointer;
      font-size: 16px; transition: all 0.2s var(--ease); box-shadow: var(--card-shadow);
    }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn:active { transform: scale(0.97); }
    .lightbox-close:active { transform: scale(0.92); }
    /* prev/next 基础样式带 translateY(-50%) 垂直居中，:active 缩放必须保留该位移——
       否则按下瞬间按钮跳位半个身高，mouseup 落到背景上，点击关闭而非切换照片 */
    .lightbox-prev:active, .lightbox-next:active { transform: translateY(-50%) scale(0.92); }

    .container { max-width: 1200px; margin: 0 auto; padding: 50px 24px; }
    .page-header {
      text-align: center; margin-bottom: 40px;
    }
    .page-title {
      font-size: 32px; font-weight: 700; color: var(--text); margin-bottom: 8px;
    }
    .page-subtitle {
      color: var(--text-mute); font-size: 15px;
    }
    .auto-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--grad-brand);
      color: var(--on-accent);
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* 瀑布流 */
    .masonry {
      column-count: 4;
      column-gap: 16px;
    }
    .photo-item {
      break-inside: avoid;
      margin-bottom: 16px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      transition: all 0.3s var(--ease);
      border: 1px solid var(--border);
    }
    .photo-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.15);
    }
    .photo-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s var(--ease);
    }
    .photo-item:hover img {
      transform: scale(1.05);
    }
    .photo-img-wrap {
      background: var(--item-bg);
      position: relative;
      overflow: hidden;
    }
    .photo-img-wrap::before {
      content: "";
      display: block;
      padding-top: 75%;
    }
    .lazy-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.4s var(--ease);
    }
    .lazy-img.loaded {
      opacity: 1;
    }
    /* 弱网反馈：图片加载中显示微光骨架，而非空白 */
    .photo-img-wrap.loading::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 20%, rgba(var(--primary-rgb),0.10) 50%, transparent 80%);
      animation: imgShimmer 1.3s var(--ease) infinite;
      pointer-events: none;
    }
    @keyframes imgShimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }
    /* 全部镜像加载失败：占位提示 + 点击重试 */
    .photo-img-wrap.failed::before { padding-top: 62%; }
    .photo-img-wrap.failed::after {
      content: "⚠️ 加载失败，点击重试";
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--text-mute); text-align: center; padding: 8px;
    }
    .photo-img-wrap.failed .lazy-img { display: none; }
    .photo-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .photo-info {
      padding: 12px 14px;
    }
    .photo-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* v3.0 动态相册：分类 tabs（pill 按钮组，移动端横向滚动） */
    .album-tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }
    .album-tabs::-webkit-scrollbar { display: none; }
    .album-tabs:empty { display: none; }
    .album-tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }
    .album-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }
    .album-tab[aria-selected="true"] {
      background: var(--grad-brand);
      border-color: transparent;
      color: var(--on-accent);
      box-shadow: 0 6px 18px rgba(var(--primary-rgb), 0.35);
    }
    .album-tab .tab-count {
      font-size: 12px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--item-bg);
      color: var(--text-mute);
    }
    .album-tab[aria-selected="true"] .tab-count {
      background: rgba(255,255,255,0.22);
      color: var(--on-accent);
    }
    /* 无限滚动哨兵 + 加载状态条 */
    .album-sentinel { height: 1px; }
    .album-status {
      text-align: center;
      padding: 18px 0 8px;
      font-size: 13px;
      color: var(--text-mute);
    }
    .album-status:empty { display: none; }

    /* 灯箱 */
    .lightbox {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .lightbox.active {
      display: flex;
      animation: lightboxFade 0.25s ease-out;
    }
    @keyframes lightboxFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 85vh;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: lightboxZoom 0.3s var(--ease);
    }
    @keyframes lightboxZoom {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .lightbox-close {
      position: absolute;
      top: 20px; right: 24px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: var(--on-accent);
      font-size: 24px;
      cursor: pointer;
      transition: background 0.2s var(--ease);
    }
    .lightbox-close:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev, .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px; height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: var(--on-accent);
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s var(--ease);
    }
    .lightbox-prev:hover, .lightbox-next:hover { background: rgba(255,255,255,0.2); }
    .lightbox-prev { left: 30px; }
    .lightbox-next { right: 30px; }
    .lightbox-caption {
      position: absolute;
      bottom: 30px; left: 50%;
      transform: translateX(-50%);
      color: var(--on-accent);
      font-size: 15px;
      text-align: center;
      max-width: 80%;
    }
    /* 灯箱加载态（切换照片时的等待反馈） */
    .lightbox-loading {
      display: none;
      position: absolute; inset: 0;
      align-items: center; justify-content: center;
      color: var(--on-accent);
    }
    .lightbox-loading.show { display: flex; }
    /* 灯箱失败态（全部镜像不可用） */
    .lightbox-error {
      display: none;
      position: absolute; inset: 0;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--on-accent); font-size: 15px; text-align: center;
    }
    .lightbox-error.show { display: flex; }

    .loading, .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-mute);
    }
    .album-notice {
      display: none;
      margin: 0 0 16px;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(var(--warning-rgb), 0.12);
      border: 1px solid rgba(var(--warning-rgb), 0.35);
      color: var(--warning-strong);
      font-size: 13px;
      text-align: center;
    }
    body.dark .album-notice {
      background: rgba(var(--warning-rgb), 0.15);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary-text);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      text-align: center; padding: 40px 24px; color: var(--text-mute);
      font-size: 13px; border-top: 1px solid var(--border);
      /* CLS 防护：site.footer 动态注入可能换行，预留两行高度避免布局位移 */
      min-height: 102px;
    }


    @media (max-width: 1024px) { .masonry { column-count: 3; } }
    @media (max-width: 768px) { .masonry { column-count: 2; } }
    .nav-toggle { display: none; width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s var(--ease); }
    .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 0; z-index: 99; animation: slideDown 0.25s var(--ease); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu.active { display: block; }
    .mobile-menu a { display: block; padding: 14px 24px; color: var(--text-light); text-decoration: none; font-size: 16px; transition: all 0.2s var(--ease); }
    .mobile-menu a:hover, .mobile-menu a.active { color: var(--primary-text); background: var(--item-bg, rgba(var(--primary-rgb),0.06)); }
    @media (max-width: 900px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .page-title { font-size: 24px; }
      .container { padding: 36px 20px; }
      .lightbox { padding: 20px; }
      .lightbox-prev { left: 10px; }
      .lightbox-next { right: 10px; }
    }
  
    /* 可访问性：键盘焦点清晰可见 */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    /* 尊重系统减弱动效偏好：关闭装饰性动画与过渡 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* 交互反馈：按下态（opacity 方案，避免与组件既有 transform 冲突） */
    a:active, button:active, [role="button"]:active,
    .game-card:active, .post-card:active, .link-card:active, .timeline-item:active,
    .rank-tab:active, .tab:active, .opt-btn:active { opacity: 0.85; }
    .album-retry:hover { filter: brightness(1.12); }
    .album-retry:active { filter: brightness(0.94); }
  </style>
</head>

<script>
  // 同步应用主题：避免暗色模式首屏白闪（FOUC）。与页尾 initTheme 逻辑保持一致
  try {
    var __t = localStorage.getItem("theme");
    var __dark = __t === "dark" || (!__t && matchMedia("(prefers-color-scheme: dark)").matches);
    if (__dark) {
      document.body.classList.add("dark");
    }
    // 主题色同步：移动端地址栏/状态栏颜色与首屏主题一致（后续手动切换由 common.js 接管）
    var __tc = document.querySelector('meta[name="theme-color"]:not([media])');
    if (__tc) __tc.setAttribute("content", __dark ? "#0f0f1a" : "#4f46e5");
  } catch (e) {}
</script>

  <script>
  const { escapeHtml, escapeAttr } = window.BlogUtils;

  // 割裂体验，又会突发批量 API 请求。置顶加载第一页才是符合直觉的行为。
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";




    let photos = []; // 当前分类下已加载的照片（灯箱与预加载基于它）
    let currentPhotoIdx = 0;

    // 照片列表经 Worker /api/album/photos 获取（Worker 侧多源故障转移 + 缓存 + 分页），
    // 浏览器只同源通信，避免 CSP connect-src 限制；每张照片带多个镜像地址，
    // 图片加载失败时逐个切换——本机 DNS 加速失效时自动走下一个镜像。

    // ===== v3.0 动态相册：分类 tabs + 分页接口 + 无限滚动 =====
    const ALBUM_PAGE_SIZE = 24;
    // v3 缓存结构：{ v: 3, categories, photos }（v2 是裸数组，直接弃用重新拉取）
    const PHOTO_CACHE_KEY = "album_photos_v3";
    const PHOTO_CACHE_TIME_KEY = "album_photos_v3_time";

    const albumState = {
      category: "all",   // 当前分类 id（"all" = 全部）
      offset: 0,         // 下一页偏移
      loading: false,    // 分页请求去重
      hasMore: true,     // 是否还有更多
      total: 0,          // 当前分类总数
      categories: [],    // [{ id, name, count }]
      cacheMode: false,  // 缓存兜底模式（接口失败，本地过滤）
    };
    let cacheAllPhotos = []; // 缓存模式下的全量照片（本地分类过滤用）

    function readPhotoCache() {
      try {
        const raw = localStorage.getItem(PHOTO_CACHE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (data && data.v === 3 && Array.isArray(data.photos) && data.photos.length) {
          return { photos: data.photos, categories: Array.isArray(data.categories) ? data.categories : [] };
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function writePhotoCache(list, categories) {
      try {
        localStorage.setItem(PHOTO_CACHE_KEY, JSON.stringify({ v: 3, categories: categories || [], photos: list }));
        localStorage.setItem(PHOTO_CACHE_TIME_KEY, Date.now().toString());
      } catch (e) { /* 存储空间不足时静默 */ }
    }

    function showAlbumStatus(text) {
      const el = document.getElementById("album-status");
      if (el) el.textContent = text || "";
    }

    /** 本地聚合分类计数（缓存兜底渲染时用，接口模式的计数以服务端为准） */
    function aggregateCategories(list) {
      const count = new Map();
      const names = new Map();
      for (const p of list) {
        const id = p && p.category ? String(p.category) : "all";
        count.set(id, (count.get(id) || 0) + 1);
        if (!names.has(id)) names.set(id, id);
      }
      const cats = [{ id: "all", name: "全部", count: list.length }];
      for (const [id, n] of count) {
        if (id === "all") continue;
        cats.push({ id, name: names.get(id), count: n });
      }
      return cats;
    }

    function showAlbumNotice(text) {
      const el = document.getElementById("album-content");
      let notice = document.getElementById("album-notice");
      if (!notice) {
        notice = document.createElement("div");
        notice.id = "album-notice";
        notice.className = "album-notice";
        notice.setAttribute("role", "status");
        notice.setAttribute("aria-live", "polite");
        el.prepend(notice);
      }
      notice.textContent = text;
      notice.style.display = "block";
    }

    /** 分类 tabs 渲染（全部 + 各分类含计数；点击切换 → 重置分页 → 加载第一页） */
    function renderTabs(categories) {
      albumState.categories = Array.isArray(categories) ? categories : [];
      const box = document.getElementById("album-tabs");
      if (!box) return;
      const tabs = [{ id: "all", name: "全部", count: albumState.total }]
        .concat(albumState.categories.filter((c) => c && c.id !== "all"));
      box.innerHTML = tabs.map((c) => `
        <button type="button" class="album-tab" role="tab" data-cat="${escapeAttr(c.id)}"
          aria-selected="${c.id === albumState.category ? "true" : "false"}">
          ${escapeHtml(c.name || c.id)}<span class="tab-count">${c.count}</span>
        </button>`).join("");
      box.querySelectorAll(".album-tab").forEach((btn) => {
        btn.addEventListener("click", () => switchCategory(btn.dataset.cat));
      });
    }

    function switchCategory(id) {
      const next = id || "all";
      if (next === albumState.category || albumState.loading) return;
      albumState.category = next;
      albumState.offset = 0;
      albumState.hasMore = true;
      photos = [];
      currentPhotoIdx = 0;
      document.getElementById("album-content").innerHTML = "";
      document.querySelectorAll(".album-tab").forEach((b) => {
        b.setAttribute("aria-selected", b.dataset.cat === albumState.category ? "true" : "false");
      });
      if (albumState.cacheMode) {
        // 缓存兜底模式：接口刚才失败过，本地过滤全量缓存，不再打请求
        const filtered = albumState.category === "all"
          ? cacheAllPhotos
          : cacheAllPhotos.filter((p) => p.category === albumState.category);
        renderPhotosAll(filtered, albumState.categories, false);
        return;
      }
      loadAlbumPage();
    }

    async function fetchAlbumPage() {
      const params = new URLSearchParams({
        category: albumState.category,
        offset: String(albumState.offset),
        limit: String(ALBUM_PAGE_SIZE),
      });
      // 统一走 BlogApi：15s 超时 + 失败自动重试 1 次 + 错误信息归一化
      const data = await BlogApi.get(`/api/album/photos?${params.toString()}`, {
        timeout: 15000,
        retry: 1,
      });
      if (!data || !Array.isArray(data.photos)) {
        throw new Error("相册接口返回数据格式异常");
      }
      return data;
    }

    /** 加载一页并增量渲染；首屏失败时走本地缓存/错误态，翻页失败时保留已加载内容 */
    async function loadAlbumPage() {
      if (albumState.loading) return;
      albumState.loading = true;
      showAlbumStatus("加载中…");
      try {
        const data = await fetchAlbumPage();
        const items = data.photos || [];
        // 先更新总数再渲染 tabs（tabs 的「全部」计数读 albumState.total）
        albumState.total = typeof data.total === "number" ? data.total : photos.length + items.length;
        albumState.hasMore = !!data.hasMore;
        albumState.offset = data.nextOffset != null ? data.nextOffset : albumState.offset + items.length;
        if (Array.isArray(data.categories)) renderTabs(data.categories);
        appendPhotoItems(items);
        if (!albumState.hasMore) {
          writePhotoCache(photos, albumState.categories);
          showAlbumStatus(`已展示全部 ${photos.length} 张照片`);
        } else {
          showAlbumStatus(`已加载 ${photos.length} / ${albumState.total} 张，下滑加载更多`);
        }
      } catch (err) {
        if (photos.length === 0 && albumState.offset === 0) {
          // 首屏失败：本地缓存兜底（GitHub 不稳定时不空屏）
          const cached = readPhotoCache();
          if (cached) {
            // cacheAllPhotos 始终保持全量（供缓存模式下的本地分类切换），
            // 渲染时按当前分类过滤——切换分类途中遇接口故障也不丢上下文
            cacheAllPhotos = cached.photos.slice();
            albumState.cacheMode = true;
            const filtered = albumState.category === "all"
              ? cacheAllPhotos
              : cacheAllPhotos.filter((p) => p.category === albumState.category);
            renderPhotosAll(filtered, cached.categories, false);
            showAlbumNotice("⚠️ 网络不稳定，正在展示缓存的相册，恢复后将自动更新");
            return;
          }
          document.getElementById("album-content").innerHTML =
            `<div class="empty">❌ 相册加载失败<br><br>${escapeHtml(err.message || "未知错误")}<br><br>请检查 GitHub 仓库配置，或稍后重试<br><br><button class="album-retry" style="display:inline-block;margin-top:12px;padding:10px 24px;border:none;border-radius:8px;background:var(--primary);color:var(--on-accent);cursor:pointer;font-size:14px;transition:filter 0.2s var(--ease)" onclick="init()">🔄 重试</button></div>`;
          showAlbumStatus("");
          return;
        }
        // 翻页失败：保留已加载照片，提示重试（下次滚动哨兵进入视口会再触发）
        showAlbumStatus(`⚠️ 加载更多失败：${err.message || "网络错误"}，下滑重试`);
      } finally {
        albumState.loading = false;
      }
    }

    /** 无限滚动：哨兵进入视口且还有更多 → 加载下一页 */
    function setupInfiniteScroll() {
      const sentinel = document.getElementById("album-sentinel");
      if (!sentinel || !("IntersectionObserver" in window)) return;
      const io = new IntersectionObserver((entries) => {
        if (entries.some((e) => e.isIntersecting) && albumState.hasMore && !albumState.loading) {
          loadAlbumPage();
        }
      }, { rootMargin: "300px 0px" }); // 提前 300px 预取，滚动更顺滑
      io.observe(sentinel);
    }

    /** 全量渲染（缓存兜底路径）：一次性渲染 + tabs 本地过滤 */
    function renderPhotosAll(list, categories, fromCache) {
      document.getElementById("album-content").innerHTML = "";
      photos = [];
      currentPhotoIdx = 0;
      albumState.hasMore = false;
      albumState.total = list.length;
      if (fromCache) {
        cacheAllPhotos = list.slice();
        albumState.cacheMode = true;
      }
      appendPhotoItems(list);
      const cats = Array.isArray(categories) && categories.length ? categories : aggregateCategories(list);
      renderTabs(cats);
      showAlbumStatus(`已展示全部 ${list.length} 张照片（离线缓存）`);
    }

    /** 增量渲染一页照片：只对新节点绑事件 + 懒加载，已加载照片不受影响 */
    function appendPhotoItems(items) {
      const content = document.getElementById("album-content");
      if (!items.length && photos.length === 0) {
        content.innerHTML = '<div class="empty">📭 相册还没有照片<br><br>在管理后台设置 GitHub 仓库后，照片会自动显示在这里</div>';
        return;
      }
      let masonry = content.querySelector(".masonry");
      if (!masonry) {
        content.innerHTML = ""; // 清除首屏 loading 占位
        masonry = document.createElement("div");
        masonry.className = "masonry";
        content.appendChild(masonry);
      }
      const startIdx = photos.length;
      const frag = document.createDocumentFragment();
      const nodes = [];
      items.forEach((p, i) => {
        const idx = startIdx + i;
        const item = document.createElement("div");
        item.className = "photo-item";
        item.dataset.idx = String(idx);
        item.setAttribute("role", "button");
        item.setAttribute("tabindex", "0");
        item.setAttribute("aria-label", `查看照片 ${escapeAttr(p.name || "")}`);
        item.style.animation = `fadeUp 0.5s ease ${i * 0.03}s both`;
        /* v8.1 LCP 攻坚：首屏图片一律懒加载，不再给 fetchpriority=high。
         * 实测取证：相册原图（手机截图）单张 1.2~1.8s 且即便 cache=HIT 也慢，
         * 给它 high 优先级等于让几 MB 原图去和 CSS/字体抢首屏带宽，
         * LCP 被这张图死死钉住（3.1~4.6s）。
         * 改为：LCP 由标题/骨架屏承担（文本渲染约 1s），原图随后由
         * observer 加载，用户看到的是「先出结构、再出图」，体感更快。
         *
         * v8.1 真正的解法：列表只加载 9KB 的缩略图（原图 549KB 的 1.7%），
         * 镜像链 = thumbs ++ mirrors：缩略图全部失败时自动回退原图，
         * 复用已有的多镜像切换逻辑，历史照片无缩略图也不影响功能。
         *
         * 有了缩略图之后，「一律懒加载」这条老规矩要跟着改：9KB 的图
         * 直接加载几乎零成本，而等 observer 触发再加载会白白多等一个
         * 「布局完成 → 交叉检测 → 发起请求」的来回（实测相册 LCP 4.4s，
         * 而缩略图请求本身只要 339ms，差额全耗在这段空等上）。
         * 因此：有缩略图的前 3 张（首屏可见区）立即加载，其余仍走懒加载；
         * 没有缩略图的老照片一律懒加载，避免大原图抢首屏带宽。 */
        const eager = i < 3 && (p.thumbs || []).length > 0;
        item.innerHTML = `
          <div class="photo-img-wrap loading">
            <img data-mirrors="${escapeAttr(JSON.stringify((p.thumbs || []).concat(p.mirrors || [])))}" alt="${escapeAttr(p.name || "")}" class="lazy-img" ${eager ? 'data-eager="1" loading="eager"' : 'loading="lazy"'} decoding="async">
          </div>
          <div class="photo-info">
            <div class="photo-name">${escapeHtml((p.name || "").replace(/\.[^.]+$/, ""))}</div>
          </div>`;
        nodes.push(item);
        frag.appendChild(item);
      });
      masonry.appendChild(frag);
      photos = photos.concat(items);

      // 照片项键盘可操作：Enter / 空格 打开灯箱（鼠标走 click）
      nodes.forEach((item) => {
        const open = () => {
          const wrap = item.querySelector(".photo-img-wrap");
          // 加载失败态：点击时双管齐下——重试网格缩略图，同时打开灯箱
          // （灯箱有独立加载链路与错误态重试按钮，弱网下大图体验更完整；
          //  只重试不开灯箱会违背「照片加载失败时 UI 仍可用」的交互契约）
          if (wrap && wrap.classList.contains("failed")) {
            wrap.classList.remove("failed");
            wrap.classList.add("loading");
            const img = item.querySelector(".lazy-img");
            // 主动重试：先解锁再从头加载（否则会被 loadImage 的防重锁拦下）
            if (img) { img.dataset.idx = "0"; img.dataset.imgLoading = ""; BlogApi.github.loadImage(img); }
          }
          openLightbox(parseInt(item.dataset.idx, 10));
        };
        item.addEventListener("click", open);
        item.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            open();
          }
        });
      });

      // 懒加载只观察新节点（已观察过的照片不受翻页影响）
      if ("IntersectionObserver" in window) {
        const imgObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              BlogApi.github.loadImage(entry.target);
              observer.unobserve(entry.target);
            }
          });
        }, { rootMargin: "200px 0px" }); // 提前 200px 开始加载

        nodes.forEach((item) => {
          const img = item.querySelector(".lazy-img");
          if (!img) return;
          /* v8.1：带 data-eager 的首屏缩略图立即加载，不等 observer。
           * 注意 <img> 没有 src 属性，HTML 的 loading="eager" 对它不生效，
           * 真正的加载时机完全由这里决定 —— 所以必须在 JS 侧显式触发，
           * 光改 HTML 属性是无效的。 */
          if (img.dataset.eager === "1") { BlogApi.github.loadImage(img); return; }
          imgObserver.observe(img);
        });
      } else {
        // 降级方案：直接加载
        nodes.forEach((item) => {
          const img = item.querySelector(".lazy-img");
          if (img) BlogApi.github.loadImage(img);
        });
      }

      // DevOps 2.2：首批照片就绪后，空闲预取前 3 张的首镜像（同源 /api/github/raw/*，
      // 经 SW SWR 入缓存 + Cloudflare 边缘缓存预热），用户滚动到视口前已就绪；
      // 省流模式与慢速网络跳过，不与首屏争抢带宽。
      if (startIdx === 0) {
        const conn = navigator.connection;
        if (!conn || (!conn.saveData && !/(^|-)(slow-)?2g$/.test(conn.effectiveType || ""))) {
          const idle = window.requestIdleCallback || function (fn) { setTimeout(fn, 1200); };
          idle(() => {
            /* v8.1：预取从**第 4 张起**（跳过首屏前 3 张）。
             * 旧逻辑预取前 3 张，而这 3 张已被 observer 加载过——
             * 于是同一张原图被请求两遍（实测两条 1.6s 的 raw 请求并行）。
             * 预取只服务「用户即将滚动到的区域」，不该重复预热已加载的图片。 */
            photos.slice(3, 9).forEach((p) => {
              // v8.1：预取缩略图（9KB）而非原图（549KB），预热成本降两个数量级
              const m = (p.thumbs && p.thumbs[0]) || (p.mirrors && p.mirrors[0]);
              if (!m) return;
              const l = document.createElement("link");
              l.rel = "prefetch";
              l.href = m;
              document.head.appendChild(l);
            });
          });
        }
      }
    }

    // 灯箱打开前最后聚焦的元素（关闭后归还焦点）
    let lightboxLastFocus = null;

    function showLightboxLoading() {
      document.getElementById("lightbox-loading").classList.add("show");
      document.getElementById("lightbox-error").classList.remove("show");
    }
    function hideLightboxLoading() {
      document.getElementById("lightbox-loading").classList.remove("show");
    }
    function showLightboxError() {
      document.getElementById("lightbox-loading").classList.remove("show");
      document.getElementById("lightbox-error").classList.add("show");
    }

    /** 灯箱内图片全部镜像失败时呈现失败态（事件由 BlogApi.github.loadImage 派发） */
    document.getElementById("lightbox").addEventListener("imgallfailed", (e) => {
      if (e.target.id === "lightbox-img") showLightboxError();
    });
    /** 网格内图片全部镜像失败时，占位格呈现失败态（点击可重试） */
    document.getElementById("album-content").addEventListener("imgallfailed", (e) => {
      const wrap = e.target.closest(".photo-img-wrap");
      if (!wrap) return;
      wrap.classList.remove("loading");
      wrap.classList.add("failed");
      /* 镜像链走完仍失败：贴上本地占位图，避免出现破图图标或空白格。
       * 注意 utils/common.js 的全局兜底会主动跳过带 data-mirrors 的图，
       * 所以这一步只能由容器在 imgallfailed 时自己补。 */
      e.target.dataset.imgFallback = "1";
      e.target.src = "/icons/placeholder-cover.svg";
      e.target.classList.add("img-placeholder");
    });

    /**
     * 缩略图先顶上之后，后台把原图拉下来替换（仍走多镜像兜底）。
     * 原图已在缓存里则瞬间切换；全部失败就保持缩略图，不影响可看性。
     * @param {HTMLImageElement} img
     * @param {number} idx      打开时的序号，用于翻页后「别串台」
     * @param {string[]} list   待尝试的原图镜像
     */
    function upgradeToFull(img, idx, list) {
      if (!list || !list.length) return;
      const url = list[0];
      const pre = new Image();
      pre.onload = () => {
        if (currentPhotoIdx !== idx) return; // 用户已翻页，放弃这次升级
        img.src = url;                        // 命中缓存，切换是瞬间的
        img.classList.add("loaded");
      };
      pre.onerror = () => {
        // 主镜像失败：依次试剩余镜像，全灭就保持缩略图（已经能看）
        if (list.length > 1) upgradeToFull(img, idx, list.slice(1));
      };
      pre.src = url;
    }

    /**
     * 灯箱渐进式加载：先缩略图秒开 → 原图后台升级。
     * 旧逻辑直接从 549KB 原图开始，点开要干等 2.3s；现在缩略图来自
     * 列表页已加载过的缓存，几乎零延迟。
     */
    function loadLightboxImage(img, idx) {
      const p = photos[idx];
      const thumbs = p.thumbs || [];
      const full = p.mirrors || [];
      /* 显式清锁：翻页可能发生在上一张还没加载完时，此时入口锁仍是 "1"，
       * 不清的话这一次会被当成「重复调用」直接挡掉，灯箱卡在 loading。 */
      img.dataset.imgLoading = "";
      img.dataset.mirrors = JSON.stringify(thumbs.concat(full));
      img.dataset.idx = "0";
      img.classList.remove("loaded");
      img.alt = p.name || "照片";
      showLightboxLoading();
      BlogApi.github.loadImage(img, () => {
        hideLightboxLoading();
        if (thumbs.length) upgradeToFull(img, idx, full);
      });
    }

    function openLightbox(idx) {
      currentPhotoIdx = idx;
      const p = photos[idx];
      const img = document.getElementById("lightbox-img");
      img.style.opacity = ""; // 复位关闭时清图的隐藏态（v7.3）
      loadLightboxImage(img, idx);
      document.getElementById("lightbox-caption").textContent = `${idx + 1} / ${photos.length} · ${p.name}`;
      const lb = document.getElementById("lightbox");
      const wasActive = lb.classList.contains("active");
      lb.classList.add("active");
      document.body.style.overflow = "hidden";
      // 焦点移入对话框并陷阱（键盘可用性）。仅首次打开时记录触发元素——
      // 照片切换时灯箱已激活，若重复记录会把对话框内的关闭按钮当成触发元素，
      // 导致关闭后焦点无法归还到最初的照片项。
      if (!wasActive) {
        lightboxLastFocus = document.activeElement;
        document.querySelector(".lightbox-close").focus();
      }
      preloadNeighbors(idx);
    }

    /** 预加载相邻照片：左右切换时弱网下也能较快呈现 */
    function preloadNeighbors(idx) {
      if (photos.length < 2) return; // 只有一张时「相邻」还是自己，无需预载
      for (const n of [(idx - 1 + photos.length) % photos.length, (idx + 1) % photos.length]) {
        /* v8.1：只预载 9KB 缩略图，不再为了「可能翻到」提前下载 549KB 原图。
         * 原图由 upgradeToFull 在真正打开那一张时才拉，流量用在刀刃上。 */
        const t = photos[n] && photos[n].thumbs && photos[n].thumbs[0];
        if (t) { const pre = new Image(); pre.src = t; }
      }
    }

    function retryLightbox() {
      // v8.1：统一走渐进式加载（清掉旧锁，允许重新走一轮镜像链）
      const img = document.getElementById("lightbox-img");
      img.dataset.imgLoading = "";
      loadLightboxImage(img, currentPhotoIdx);
    }

    // 记录按下点：仅当按下与松开都落在背景/关闭按钮上才允许关闭，
    // 防御「按钮带按压动画导致按下后位移、释放在背景」类回归（mousedown 在按钮、mouseup 在背景时 click 目标为背景）。
    // 按下点只对紧随其后的那一次 click 有效（用后即焚），避免残留拦截 Esc/程序化关闭。
    let lightboxPressTarget = null;
    document.getElementById("lightbox").addEventListener("mousedown", (e) => { lightboxPressTarget = e.target; });
    document.getElementById("lightbox").addEventListener("click", () => {
      setTimeout(() => { lightboxPressTarget = null; }, 0);
    }, true); // capture：即使子按钮 stopPropagation 也能清理
    document.addEventListener("mouseleave", () => { lightboxPressTarget = null; });
    window.addEventListener("blur", () => { lightboxPressTarget = null; });

    function closeLightbox(e) {
      const press = lightboxPressTarget;
      lightboxPressTarget = null;
      if (e && e.target && !e.target.matches(".lightbox, .lightbox-close")) return;
      if (press && !press.matches(".lightbox, .lightbox-close")) return;
      // 先归还焦点再隐藏：灯箱隐藏后其中的按钮不可聚焦，focus() 会静默失败落到 body
      if (lightboxLastFocus && lightboxLastFocus.focus) lightboxLastFocus.focus();
      document.getElementById("lightbox").classList.remove("active");
      document.body.style.overflow = "";
      lightboxLastFocus = null;
      // v7.3 内存：清空已解码大图，让位图可被 GC（否则关闭灯箱后
      // 整张原图仍滞留解码缓存，连续看多张大图会持续累积）
      const lbImg = document.getElementById("lightbox-img");
      if (lbImg) { lbImg.removeAttribute("src"); lbImg.style.opacity = "0"; }
    }

    function prevPhoto(e) {
      e.stopPropagation();
      currentPhotoIdx = (currentPhotoIdx - 1 + photos.length) % photos.length;
      openLightbox(currentPhotoIdx);
    }

    function nextPhoto(e) {
      e.stopPropagation();
      currentPhotoIdx = (currentPhotoIdx + 1) % photos.length;
      openLightbox(currentPhotoIdx);
    }

    // 键盘导航 + 焦点陷阱
    document.addEventListener("keydown", e => {
      if (!document.getElementById("lightbox").classList.contains("active")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") prevPhoto(e);
      if (e.key === "ArrowRight") nextPhoto(e);
      // Tab 焦点陷阱：对话框内循环
      if (e.key === "Tab") {
        const focusables = document.querySelectorAll(".lightbox button");
        if (!focusables.length) return;
        const first = focusables[0], last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
        else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
      }
    });

    async function init() {
      // 重置分页状态（「重试」按钮会再次调用 init，必须清空上一轮残留）
      albumState.category = "all";
      albumState.offset = 0;
      albumState.hasMore = true;
      albumState.loading = false;
      albumState.cacheMode = false;
      photos = [];
      cacheAllPhotos = [];
      currentPhotoIdx = 0;

      // 加载站点信息
      let siteReqFailed = false;
      let site = null;
      /* v8.1：裸 fetch → BlogApi（3s 熔断 + 并发去重 + 本地缓存兜底） */
      try {
        const s = await BlogApi.get("/api/site", {
          cacheKey: "site", retry: 1, onFallback: window.markOfflineBanner
        });
        if (s && typeof s.title === "string") site = s;
        else siteReqFailed = true;
      } catch (e) {
        siteReqFailed = true;
      }

      if (site) {
        document.title = `相册 - ${site.title}`;
        document.getElementById("nav-logo").textContent = site.title;
        document.getElementById("footer-text").textContent = site.footer;

        // 如果配置了 GitHub 仓库，加载照片
        if (site.githubRepo) {
          const useCdn = site.useCdn !== false;
          // 显示仓库同步标识
          if (site.autoMode) {
            const subtitle = document.getElementById("album-subtitle");
            subtitle.innerHTML = `${escapeHtml(site.githubRepo)} 仓库自动同步 <span class="auto-badge">🤖 GitHub 同步</span>${useCdn ? ' <span class="auto-badge" style="background:var(--grad-cdn, linear-gradient(135deg,#f59e0b,var(--danger-solid)))">⚡ CDN加速</span>' : ''}`;
          }
          try {
            // 加载第一页（内部已含：tabs 渲染、缓存兜底、错误态）
            await loadAlbumPage();
            setupInfiniteScroll();
            return;
          } catch (err) {
            // loadAlbumPage 内部已兜底所有失败路径，此处仅为防御性兜底
            const cached = readPhotoCache();
            if (cached) {
              renderPhotosAll(cached.photos, cached.categories, true);
              showAlbumNotice("⚠️ 网络不稳定，正在展示缓存的相册，恢复后将自动更新");
              return;
            }
            document.getElementById("album-content").innerHTML =
              `<div class="empty">❌ 相册加载失败<br><br>${escapeHtml(err.message || "未知错误")}<br><br>请检查 GitHub 仓库配置，或稍后重试<br><br><button class="album-retry" style="display:inline-block;margin-top:12px;padding:10px 24px;border:none;border-radius:8px;background:var(--primary);color:var(--on-accent);cursor:pointer;font-size:14px;transition:filter 0.2s var(--ease)" onclick="init()">🔄 重试</button></div>`;
            return;
          }
        }
      }

      // 站点接口失败（网络/服务故障）：明确提示，避免误导成"未配置"
      if (siteReqFailed) {
        document.getElementById("album-content").innerHTML =
          `<div class="empty">⚠️ 暂时无法连接服务器<br><br>请检查网络后重试<br><br><button class="album-retry" style="display:inline-block;margin-top:12px;padding:10px 24px;border:none;border-radius:8px;background:var(--primary);color:var(--on-accent);cursor:pointer;font-size:14px;transition:filter 0.2s var(--ease)" onclick="init()">🔄 重试</button></div>`;
        return;
      }

      // 站点正常但未配置 GitHub 仓库：显示引导
      document.getElementById("album-content").innerHTML =
        `<div class="empty">
          📷 相册还没配置
          <br><br>
          前往管理后台 → 站点设置
          <br>
          填写 GitHub 仓库地址（如 username/repo）和照片文件夹路径
          <br><br>
          <small>照片会自动从 GitHub 仓库读取，无需手动上传</small>
        </div>`;
    }
    init();
  </script>
  <button class="back-top" onclick="scrollToTop()" id="backTop" aria-label="返回顶部" title="回到顶部">↑</button>
<script src="/components/music-player.js" defer></script>
</body>
</html>
