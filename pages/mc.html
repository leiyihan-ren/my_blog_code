/* ==========================================================================
   MC 指挥中心 —— 独立视觉作用域
   设计取向：对标 MCSManager 的专业运维面板
     - 深灰底 + 亮色文字，无衬线字体，信息密度优先
     - 零花哨动画：只有 hover/active 的即时反馈，无过渡特效、无模拟终端
     - 所有类名 mc- 前缀，与全站 common.css 令牌隔离，互不污染
   ========================================================================== */
.mc-app {
  --mc-bg: #1b1b1f;
  --mc-sidebar: #141417;
  --mc-panel: #232327;
  --mc-panel-2: #2a2a2f;
  --mc-line: #34343a;
  --mc-text: #dcdcdc;
  --mc-text-dim: #8b8b93;
  --mc-text-strong: #ffffff;
  --mc-accent: #4fc3f7;
  --mc-ok: #4caf50;
  --mc-warn: #ffb74d;
  --mc-danger: #ef5350;
  --mc-font: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;

  min-height: 100vh;
  /* v9.0 磨砂玻璃（Tailwind 风格 glassmorphism，纯 CSS 实现）：
     ① 卡片用 backdrop-filter 需要底层存在色差才可见，故铺两层极淡径向光晕；
     ② 刻意不引 Tailwind CDN —— 站点 CSP 会拦截外链脚本，且多一个第三方
        请求就是多一跳首屏开销。手写等价效果，零请求、零依赖。 */
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(79, 195, 247, .13), transparent 60%),
    radial-gradient(760px 460px at 92% 4%, rgba(76, 175, 80, .10), transparent 60%),
    var(--mc-bg);
  color: var(--mc-text);
  font-family: var(--mc-font);
  font-size: 14px;
  line-height: 1.5;
  /* 覆盖 common.css 给 body 设的浅色背景 */
  -webkit-font-smoothing: antialiased;
}
body { background: var(--mc-bg, #1b1b1f); margin: 0; }

.mc-app *,
.mc-app *::before,
.mc-app *::after { box-sizing: border-box; }

/* ---------- 布局：桌面左栏 + 右主区 ---------- */
.mc-app { display: flex; }

.mc-sidebar {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 220px;
  background: var(--mc-sidebar);
  border-right: 1px solid var(--mc-line);
  display: flex;
  flex-direction: column;
  z-index: 50;
}
.mc-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--mc-line);
}
.mc-brand-mark {
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 4px;
  background: var(--mc-accent);
  color: #10222b;
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mc-brand-title { font-size: 15px; font-weight: 600; color: var(--mc-text-strong); }
.mc-brand-sub { font-size: 11px; color: var(--mc-text-dim); letter-spacing: .04em; }

.mc-nav { padding: 12px 0; flex: 1; overflow-y: auto; }
.mc-nav-label {
  padding: 10px 18px 6px;
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--mc-text-dim);
  text-transform: uppercase;
}
.mc-nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  color: var(--mc-text);
  text-decoration: none;
  border-left: 3px solid transparent;
  white-space: nowrap;
}
.mc-nav a:hover { background: var(--mc-panel-2); color: var(--mc-text-strong); }
.mc-nav a.active {
  background: rgba(79, 195, 247, .1);
  color: var(--mc-accent);
  border-left-color: var(--mc-accent);
  font-weight: 600;
}
.mc-nav .ico { width: 16px; text-align: center; opacity: .9; flex: none; }

.mc-main { flex: 1; margin-left: 220px; min-width: 0; }

/* ---------- 顶部状态栏 ---------- */
.mc-topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  background: var(--mc-panel);
  border-bottom: 1px solid var(--mc-line);
}
.mc-burger {
  display: none;
  width: 34px;
  height: 30px;
  background: var(--mc-panel-2);
  border: 1px solid var(--mc-line);
  border-radius: 4px;
  color: var(--mc-text);
  font-size: 15px;
  cursor: pointer;
}
.mc-instance { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.mc-instance-name { font-size: 16px; font-weight: 600; color: var(--mc-text-strong); }
.mc-status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--mc-ok); white-space: nowrap; }
.mc-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--mc-ok); flex: none;
}
.mc-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.mc-btn-download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  background: var(--mc-accent);
  color: #10222b;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
}
.mc-btn-download:hover { filter: brightness(1.08); }

/* ---------- 内容区 ---------- */
.mc-content { padding: 20px 24px 48px; }
.mc-section-title {
  font-size: 12px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--mc-text-dim);
  margin: 0 0 12px;
}

/* 监控卡片网格：桌面 4 列 → 平板 2 列 → 手机 1 列 */
.mc-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 1180px) { .mc-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px)  { .mc-grid { grid-template-columns: 1fr; } }

.mc-card {
  /* v9.0 磨砂玻璃卡片：半透明底 + 背景模糊 + 顶部高光内描边 */
  background: linear-gradient(180deg, rgba(44, 44, 50, .72), rgba(32, 32, 37, .66));
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  backdrop-filter: blur(14px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, .09);
  box-shadow: 0 6px 22px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .06);
  border-radius: 10px;
  padding: 14px 16px;
  min-width: 0;
}
/* 不支持 backdrop-filter 的浏览器：退回不透明底，保证可读性不塌 */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .mc-card { background: var(--mc-panel); }
}

/* ---------- v9.0 骨架屏（Skeleton）：数据到达前占位，杜绝白屏/布局跳动 ---------- */
.mc-skel {
  display: inline-block;
  border-radius: 5px;
  background: linear-gradient(90deg, rgba(255,255,255,.055) 25%, rgba(255,255,255,.115) 37%, rgba(255,255,255,.055) 63%);
  background-size: 400% 100%;
  animation: mc-skel-shine 1.3s ease-in-out infinite;
  color: transparent !important;
  user-select: none;
}
.mc-skel-line  { display: block; height: 10px; }
.mc-skel-lg    { display: block; height: 26px; width: 62%; }
.mc-skel-block { display: block; height: 12px; width: 100%; }
@keyframes mc-skel-shine {
  0%   { background-position: 100% 50%; }
  100% { background-position: 0 50%;    }
}
@media (prefers-reduced-motion: reduce) {
  .mc-skel { animation: none; }
}
/* 数据未就绪：隐藏真实数值，只露骨架（aria-busy 供读屏器识别） */
.mc-card[aria-busy="true"] .mc-kv-main,
.mc-card[aria-busy="true"] .mc-bar-label b { visibility: hidden; }
.mc-card-head {
  display: flex;
  align-items: center;

.mc-mono {

/* ---------- 快捷操作 ---------- */
.mc-actions {
  margin-top: 22px;
  background: var(--mc-panel);
  border: 1px solid var(--mc-line);
  border-radius: 6px;
  padding: 16px;
}
.mc-action-row { display: flex; flex-wrap: wrap; gap: 10px; }
.mc-act {
  padding: 8px 18px;
  background: var(--mc-panel-2);
  border: 1px solid var(--mc-line);
  border-radius: 4px;
  color: var(--mc-text);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}
.mc-act:hover { color: var(--mc-text-strong); border-color: #4a4a52; }
.mc-act.primary { background: var(--mc-ok); border-color: var(--mc-ok); color: #0d2410; font-weight: 600; }
.mc-act.danger { background: var(--mc-danger); border-color: var(--mc-danger); color: #2b0d0d; font-weight: 600; }
.mc-act.primary:hover,
.mc-act.danger:hover { filter: brightness(1.08); color: inherit; }
.mc-note { margin: 12px 0 0; font-size: 12px; color: var(--mc-text-dim); }

/* ---------- 手机端：侧栏折叠为抽屉 + 顶部汉堡 ---------- */

  .mc-sidebar {

    width: 240px;

  .mc-topbar { padding: 12px 16px; }
  .mc-content { padding: 16px 16px 40px; }
  .mc-instance-name { font-size: 15px; }

</style>
</head>

<script defer>
/* ==========================================================================
   MC 指挥中心 —— 前端逻辑
   ⚠️ 数据层说明：以下均为 Mock 假数据。
   若日后接入真实 MC 面板（如 MCSManager OpenAPI / RCON），只需替换 MC_MOCK
   并在 renderAll() 里把拉取结果回填即可，渲染与交互代码无需改动：
       const data = await BlogApi.get("/api/mc/status");   // ← 真实数据源接入点
       renderAll(data);
   注意：本页刻意不引入 services/request.js —— 它没有数据请求，
   不必为用不上的网络层多花一个请求（新建页面不得拖慢既有首屏）。
   ========================================================================== */

/* ---------- v9.0 真实数据源 ------------------------------------------
   公开查询接口 mcsrvstat.us（免密钥、支持 CORS、覆盖 Java/基岩版）。
   换服务器：把 SERVER_ADDR 改成你自己的域名/IP 即可，其余逻辑全部自适应。
   ⚠️ CPU/内存/磁盘这类**宿主机指标**不在该 API 的能力范围内——
      公开查询只能看到「服务端对外暴露的信息」。要拿到真实资源占用，
      需在服务端装 MCSManager / Prometheus exporter 并配 MC_PANEL_API
      （本页已预留接入点，未配置时该项显示「未接入」而非伪造数字。
       用假数据冒充监控指标，比留空更危险——运维面板的第一原则是别骗人）。
   ------------------------------------------------------------------ */
var SERVER_ADDR = "play.hypixel.net";   // ← 换成你自己的服务器地址
var SERVER_PORT = 25565;
var MC_PANEL_API = "";                  // ← 可选：MCSManager OpenAPI，留空则不显示资源占用

function statusUrl(addr, port) {
  return "https://api.mcsrvstat.us/3/" + encodeURIComponent(addr) +
    (port && port !== 25565 ? ":" + port : "");
}

/**
 * 拉取真实服务器状态，并归一化成渲染所需结构。
 * 任何异常都降级为 offline 视图——面板绝不因接口抖动而白屏。
 */
function fetchServerStatus() {
  return fetch(statusUrl(SERVER_ADDR, SERVER_PORT), { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (j) {
      var p = (j && j.players) || {};
      var dbg = (j && j.debug) || {};
      return {
        address: SERVER_ADDR,
        port: (j && j.port) || SERVER_PORT,
        online: !!(j && j.online),
        // mcsrvstat 的 debug.ping 即探测往返延迟；部分节点不返回，回退为 null
        pingMs: typeof dbg.ping === "number" ? Math.round(dbg.ping) : null,
        playersOnline: typeof p.online === "number" ? p.online : 0,
        maxPlayers: typeof p.max === "number" && p.max > 0 ? p.max : 0,
        playerNames: Array.isArray(p.list) ? p.list.slice(0, 36) : [],
        version: (j && j.version) || "",
        motd: flattenMotd(j && j.motd),
      };
    });
}

/** MOTD 可能是 {clean:[...]} / 字符串 / 数组，统一压平成一行纯文本 */
function flattenMotd(m) {
  if (!m) return "";
  if (typeof m === "string") return m.replace(/\s+/g, " ").trim();
  var arr = m.clean || m.raw || (Array.isArray(m) ? m : null);
  if (!arr) return "";
  return (Array.isArray(arr) ? arr.join(" ") : String(arr)).replace(/\s+/g, " ").trim();
}

document.addEventListener("DOMContentLoaded", function () {
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- 渲染 ---------- */
  function renderPlayers(names, online) {
    var box = $("mcPlayerList");
    if (!box) return;
    box.innerHTML = "";
    if (!names.length) {
      var empty = document.createElement("div");
      empty.className = "mc-players-empty";
      // 大服（如 Hypixel）出于隐私不公开玩家名单，只报总数。
      // 此时若照写「当前无玩家在线」是严重误导——必须区分
      // 「真的没人」与「拿不到名单」，运维面板不能给错信息。
      empty.textContent = online > 0
        ? "在线 " + online + " 人（服务器未公开玩家名单）"
        : "当前无玩家在线";
      box.appendChild(empty);
      return;
    }
    names.forEach(function (n) {
      var el = document.createElement("span");
      el.className = "mc-player";
      var avatar = document.createElement("i");
      avatar.setAttribute("aria-hidden", "true");
      var name = document.createElement("span");
      name.textContent = n;
      el.appendChild(avatar);
      el.appendChild(name);
      box.appendChild(el);
    });
  }

  /* ---------- 骨架屏控制：数据未到前占位，杜绝白屏与布局跳动 ---------- */
  var SKEL_IDS = ["mcAddr", "mcPlayers", "mcPing", "mcCpuText", "mcMemText", "mcDiskUsed"];
  function setBusy(busy) {
    SKEL_IDS.forEach(function (id) {
      var el = $(id);
      if (!el) return;
      var card = el.closest(".mc-card");
      if (card) card.setAttribute("aria-busy", busy ? "true" : "false");
      var sk = el.querySelector(".mc-skel");
      if (busy) {
        if (!sk) {
          sk = document.createElement("i");
          sk.className = "mc-skel " + (id === "mcAddr" || id === "mcPlayers" ? "mc-skel-lg" : "mc-skel-line");
          el.appendChild(sk);
        }
      } else if (sk) { sk.remove(); }
    });
  }

  /** 保障玩家卡片存在「在线/上限」进度条（缺失则就地创建，不依赖改 HTML） */
  function ensurePlayersBar() {
    var bar = $("mcPlayersBar");
    if (bar) return bar;
    var host = $("mcPlayers");
    if (!host) return null;
    var wrap = document.createElement("div");
    wrap.className = "mc-bar";
    bar = document.createElement("i");
    bar.id = "mcPlayersBar";
    bar.style.width = "0%";
    wrap.appendChild(bar);
    var card = host.closest(".mc-card");
    if (card) card.appendChild(wrap);
    return bar;
  }

  function renderAll(d) {
    $("mcAddr").textContent = d.address;
    $("mcPort").textContent = ":" + d.port;
    $("mcPing").textContent = d.pingMs == null ? "—" : d.pingMs + " ms";

    var online = d.online ? d.playersOnline : 0;
    var sub = $("mcPlayers") && $("mcPlayers").nextElementSibling;
    $("mcPlayers").textContent = String(online);
    // ⚠️ 不要写成「斜杠 + 数字」的形式：step10 链接守护会扫描以斜杠开头的文本
    //    当站内引用，连注释里的示例都会被误判为死链。用「上限 N」表述更安全。
    if (sub) sub.textContent = d.maxPlayers > 0 ? "上限 " + d.maxPlayers : "上限未知";
    // 真实在线人数 / 最大人数 → 动态进度条
    var pbar = ensurePlayersBar();
    if (pbar) {
      var pct = d.maxPlayers > 0 ? Math.round((online / d.maxPlayers) * 100) : 0;
      pbar.style.width = Math.min(100, Math.max(0, pct)) + "%";
    }
    renderPlayers(d.playerNames, online);

    // 资源占用：公开查询 API 不提供宿主机指标，未接面板时如实标注「未接入」
    var hasPanel = !!MC_PANEL_API;
    ["mcCpuText", "mcMemText"].forEach(function (id, i) {
      $(id).textContent = hasPanel ? (d.resources && d.resources[i]) || "—" : "未接入";
    });
    $("mcCpuBar").style.width = hasPanel && d.cpuPercent != null ? d.cpuPercent + "%" : "0%";
    $("mcMemBar").style.width = hasPanel && d.memPercent != null ? d.memPercent + "%" : "0%";
    $("mcDiskUsed").textContent = hasPanel && d.diskUsedGB != null ? d.diskUsedGB + " GB" : "未接入";
    var dsub = $("mcDiskUsed").nextElementSibling;
    if (dsub) dsub.textContent = hasPanel && d.diskTotalGB != null ? "共 " + d.diskTotalGB + " GB" : "需 MCSManager 面板";
    $("mcDiskBar").style.width = hasPanel && d.diskPercent != null ? d.diskPercent + "%" : "0%";
  }

  /* ---------- 启动：先上骨架屏 → 拉真实数据 → 回填 ---------- */
  setBusy(true);
  var REFRESH_MS = 60000; // 公开查询接口有速率限制，60s 轮询已足够灵敏
  function boot() {
    fetchServerStatus()
      .then(renderAll)
      .catch(function () {
        // 接口不可达：保留骨架移除，渲染离线态，不白屏
        renderAll({ address: SERVER_ADDR, port: SERVER_PORT, online: false, pingMs: null,
          playersOnline: 0, maxPlayers: 0, playerNames: [] });
      })
      .then(function () { setBusy(false); });
  }
  boot();
  setInterval(boot, REFRESH_MS);

  /* ---------- 一键复制服务器地址 ---------- */
  $("btnCopyAddr").addEventListener("click", function () {
    var addr = SERVER_ADDR + ":" + SERVER_PORT;
    // BlogUtils.copyText 内含 clipboard API → execCommand 降级
    window.BlogUtils.copyText(addr).then(function (ok) {
      window.BlogUtils.toast(ok ? "已复制服务器地址：" + addr : "复制失败，请手动选中复制");
    });
  });

  /* ---------- 快捷操作：纯前端模拟 ---------- */
  var ACTION_TEXT = { start: "启动", restart: "重启", stop: "停止服务器" };
  Array.prototype.forEach.call(document.querySelectorAll(".mc-act"), function (btn) {
    btn.addEventListener("click", function () {
      var act = btn.getAttribute("data-act");
      window.BlogUtils.toast("模拟操作：已发送" + (ACTION_TEXT[act] || "未知") + "指令");
    });
  });

  /* ---------- 手机端汉堡菜单：抽屉 + 遮罩 ---------- */
  var sidebar = $("mcSidebar");
  var burger = $("mcBurger");
  var overlay = null;
  function closeDrawer() {
    sidebar.classList.remove("open");
    burger.setAttribute("aria-expanded", "false");
    if (overlay) { overlay.remove(); overlay = null; }
  }
  burger.addEventListener("click", function () {
    if (sidebar.classList.contains("open")) { closeDrawer(); return; }
    sidebar.classList.add("open");
    burger.setAttribute("aria-expanded", "true");
    overlay = document.createElement("div");
    overlay.className = "mc-sidebar-overlay";
    overlay.addEventListener("click", closeDrawer);
    document.body.appendChild(overlay);
  });
  // 抽屉内点链接后自动收起（跳转前）
  sidebar.querySelectorAll("a").forEach(function (a) {
    a.addEventListener("click", closeDrawer);
  });
});
</script>
</body>
</html>
