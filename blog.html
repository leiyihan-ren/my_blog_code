<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客 - 我的博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8f9ff; --card-bg: #ffffff; --text: #333; --text-light: #666;
      --text-mute: #999; --border: #eaecef; --primary: #4f46e5;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.04);
      --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.1);
      --nav-bg: rgba(255,255,255,0.85);
    }
    body.dark {
      --bg: #0f0f1a; --card-bg: #1a1a2e; --text: #e5e7eb; --text-light: #9ca3af;
      --text-mute: #6b7280; --border: #2a2a40;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.3);
      --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.5);
      --nav-bg: rgba(15,15,26,0.85);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      transition: background 0.3s, color 0.3s;
      padding-bottom: 70px;
    }
    .navbar {
      background: var(--nav-bg);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .navbar.scrolled {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0,0,0,0.04);
    }
    body.dark .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.2); }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(79,70,229,0.3); border-radius: 4px; transition: background 0.2s; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(79,70,229,0.5); }
    body.dark::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); }
    body.dark::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.5); }

    /* 文字选中样式 */
    ::selection { background: rgba(79,70,229,0.3); color: #fff; }
    ::-moz-selection { background: rgba(79,70,229,0.3); color: #fff; }
    body.dark ::selection { background: rgba(99,102,241,0.4); color: #fff; }
    body.dark ::-moz-selection { background: rgba(99,102,241,0.4); color: #fff; }
    .nav-inner {
      max-width: 960px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .logo {
      font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--text-light); text-decoration: none; font-size: 15px;
      transition: color 0.2s; position: relative;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); }
    .nav-links a.active::after {
      content: ""; position: absolute; bottom: -6px; left: 0; right: 0;
      height: 2px; background: var(--primary); border-radius: 2px;
    }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--card-bg); color: var(--text); cursor: pointer;
      font-size: 16px; transition: all 0.2s; box-shadow: var(--card-shadow);
    }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn:active { transform: scale(0.97); }
    .back-top:active { transform: scale(0.92); }
    .container { max-width: 960px; margin: 0 auto; padding: 50px 24px; }
    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap; gap: 16px;
    }
    .page-title { font-size: 28px; font-weight: 700; color: var(--text); }
    .post-count { font-size: 14px; color: var(--text-mute); }
    .search-box {
      margin-bottom: 28px; position: relative;
    }
    .search-box input {
      width: 100%; padding: 16px 20px 16px 52px;
      border: 2px solid var(--border); border-radius: 16px;
      font-size: 15px; font-family: inherit; outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: var(--card-bg); color: var(--text);
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
    }
    .search-box::before {
      content: "🔍"; position: absolute; left: 18px; top: 50%;
      transform: translateY(-50%); font-size: 18px;
      transition: transform 0.2s;
    }
    .search-box:focus-within::before {
      transform: translateY(-50%) scale(1.1);
    }
    /* 滚动渐入 */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .post-card {
      background: var(--card-bg); border-radius: 18px; padding: 28px;
      margin-bottom: 16px; box-shadow: var(--card-shadow);
      transition: all 0.3s; border: 1px solid var(--border); cursor: pointer;
    }
    .post-card:hover {
      transform: translateY(-4px); box-shadow: var(--card-shadow-hover);
      border-color: var(--primary);
    }
    .post-card h2 { font-size: 20px; margin-bottom: 10px; color: var(--text); }
    .post-card h2 a { color: var(--text); text-decoration: none; }
    .post-card:hover h2 a { color: var(--primary); }
    .post-meta {
      font-size: 13px; color: var(--text-mute); margin-bottom: 12px;
      display: flex; gap: 16px;
    }
    .post-excerpt {
      color: var(--text-light); font-size: 14px; line-height: 1.7;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    /* 搜索关键词高亮 */
    .search-highlight {
      background: linear-gradient(180deg, transparent 60%, rgba(250, 204, 21, 0.5) 60%);
      color: inherit;
      padding: 0 1px;
      border-radius: 2px;
      font-weight: 600;
    }
    body.dark .search-highlight {
      background: linear-gradient(180deg, transparent 60%, rgba(250, 204, 21, 0.35) 60%);
    }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-mute); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .footer {
      text-align: center; padding: 40px 24px; color: var(--text-mute);
      font-size: 13px; border-top: 1px solid var(--border);
    }
    .back-top {
      position: fixed; bottom: 30px; right: 30px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary); color: white; border: none;
      cursor: pointer; font-size: 20px;
      box-shadow: 0 4px 16px rgba(79,70,229,0.4);
      opacity: 0; transform: translateY(20px);
      transition: all 0.3s; z-index: 99;
    }
    .back-top.show { opacity: 1; transform: translateY(0); }
    .nav-toggle { display: none; width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s; }
    .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 0; z-index: 99; animation: slideDown 0.25s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu.active { display: block; }
    .mobile-menu a { display: block; padding: 14px 24px; color: var(--text-light); text-decoration: none; font-size: 16px; transition: all 0.2s; }
    .mobile-menu a:hover, .mobile-menu a.active { color: var(--primary); background: var(--item-bg, rgba(79,70,229,0.06)); }
    @media (max-width: 900px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .page-title { font-size: 22px; }
      .container { padding: 36px 20px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" id="nav-logo">我的博客</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html">首页</a></li>
          <li><a href="blog.html" class="active">博客</a></li>
          <li><a href="album.html">相册</a></li>
          <li><a href="timeline.html">时间线</a></li>
          <li><a href="guestbook.html">留言</a></li>
          <li><a href="games.html">游戏</a></li>
          <li><a href="links.html">友链</a></li>
        </ul>
        <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="blog.html" class="active">博客</a>
    <a href="album.html">相册</a>
    <a href="timeline.html">时间线</a>
    <a href="guestbook.html">留言</a>
    <a href="games.html">游戏</a>
    <a href="links.html">友链</a>
  </div>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">📝 全部文章</h1>
      <span class="post-count" id="post-count">0 篇</span>
    </div>
    <div class="search-box">
      <input type="text" id="search" placeholder="搜索文章..." oninput="doSearch()">
    </div>
    <div id="post-list" class="reveal"></div>
  </div>

  <div class="footer" id="footer-text">© 2026 Lei Yihan</div>
  <button class="back-top" onclick="scrollToTop()" id="backTop">↑</button>

  <script>
    // HTML 转义（防 XSS）
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    // 安全的 localStorage 读写（隐私模式/存储被禁用的浏览器不抛错）
    const safeStorage = {
      get(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
      set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
    };

    // 主题切换
    function toggleTheme() {
      document.body.classList.toggle("dark");
      safeStorage.set("theme", document.body.classList.contains("dark") ? "dark" : "light");
      document.querySelector(".theme-btn").textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
    }
    (function() {
      const s = safeStorage.get("theme");
      const d = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (s === "dark" || (!s && d)) { document.body.classList.add("dark"); document.querySelector(".theme-btn").textContent = "☀️"; }
    })();

    // 移动端菜单
    (function() {
      const t = document.getElementById("navToggle"), m = document.getElementById("mobileMenu");
      if (!t || !m) return;
      t.addEventListener("click", () => { t.classList.toggle("active"); m.classList.toggle("active"); });
      m.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { t.classList.remove("active"); m.classList.remove("active"); }));
      document.addEventListener("click", e => {
        if (!e.target.closest(".nav-right") && !e.target.closest("#mobileMenu")) { t.classList.remove("active"); m.classList.remove("active"); }
      });
    })();

    const DEFAULT_POSTS = [
      { id: "welcome", title: "欢迎来到我的博客！",
        content: "这是我的第一篇文章。\n\n我是一名七年级的学生，喜欢编程和游戏。\n\n以后会在这里分享我的学习笔记和生活日常。",
        date: new Date().toISOString().split("T")[0] }
    ];
    let allPosts = DEFAULT_POSTS;
    let currentQuery = "";

    // 关键词高亮：先转义 HTML，再用 <mark> 包裹匹配片段（安全）
    function highlight(text, query) {
      const escaped = escapeHtml(text);
      if (!query) return escaped;
      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const regex = new RegExp(`(${safeQuery})`, "gi");
      return escaped.replace(regex, '<mark class="search-highlight">$1</mark>');
    }

    function renderPosts(posts, query) {
      currentQuery = query || "";
      const list = document.getElementById("post-list");
      document.getElementById("post-count").textContent = posts.length + " 篇" + (query ? ` · 关键词「${escapeHtml(query)}」` : "");
      if (posts.length === 0) {
        list.innerHTML = query
          ? `<div class="empty">没有找到与「${escapeHtml(query)}」相关的文章</div>`
          : `<div class="empty">还没有文章，去管理后台发布第一篇吧</div>`;
        return;
      }
      list.innerHTML = posts.map((p, i) => {
        const content = p.content || "";
        const rawExcerpt = p.desc && p.desc.trim() ? p.desc : content.replace(/\n/g, " ").slice(0, 150) + "...";
        return `
        <div class="post-card" style="animation:fadeUp 0.5s ease ${i * 0.05}s both" onclick="location.href='post.html?id=${escapeHtml(p.id)}'">
          <h2><a href="post.html?id=${escapeHtml(p.id)}">${highlight(p.title, currentQuery)}</a></h2>
          <div class="post-meta">
            <span>📅 ${escapeHtml(p.date)}</span>
            <span>📖 ${Math.ceil(content.length / 300)} 分钟阅读</span>
            <span>👁️ ${(p.views || 0).toLocaleString()}</span>
            <span>❤️ ${p.likes || 0}</span>
          </div>
          <p class="post-excerpt">${highlight(rawExcerpt, currentQuery)}</p>
        </div>
      `}).join("");
    }

    let searchTimer = null;
    function doSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const q = document.getElementById("search").value.trim();
        if (!q) { renderPosts(allPosts, ""); return; }
        const ql = q.toLowerCase();
        renderPosts(allPosts.filter(p =>
          (p.title || "").toLowerCase().includes(ql) || (p.content || "").toLowerCase().includes(ql)
        ), q);
      }, 200);
    }

    function scrollToTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }
    function handleNavScroll() {
      const navbar = document.querySelector(".navbar");
      if (window.scrollY > 10) navbar.classList.add("scrolled");
      else navbar.classList.remove("scrolled");
    }
    let scrollTicking = false;
    window.addEventListener("scroll", () => {
      if (!scrollTicking) {
        requestAnimationFrame(() => {
          handleNavScroll();
          const btn = document.getElementById("backTop");
          btn.classList.toggle("show", window.scrollY > 300);
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    });
    handleNavScroll();

    // ========== 键盘快捷键 ==========
    document.addEventListener("keydown", function(e) {
      const tag = document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") {
        // 输入框内 ESC 清空搜索
        if (e.key === "Escape" && tag === "INPUT" && document.activeElement.id === "search") {
          const el = document.getElementById("search");
          if (el) { el.value = ""; el.blur(); renderPosts(allPosts, ""); }
        }
        return;
      }

      switch(e.key) {
        case "/":
          // / - 聚焦搜索框
          e.preventDefault();
          document.getElementById("search").focus();
          break;
        case "t":
        case "T":
          // T - 回到顶部
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: "smooth" });
          break;
        case "j":
        case "J":
          // J - 向下滚动
          e.preventDefault();
          window.scrollBy({ top: 200, behavior: "smooth" });
          break;
        case "k":
        case "K":
          // K - 向上滚动
          e.preventDefault();
          window.scrollBy({ top: -200, behavior: "smooth" });
          break;
      }
    });

    // 主题跟随系统变化
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e) {
        const saved = localStorage.getItem("theme");
        if (!saved) {
          if (e.matches) {
            document.body.classList.add("dark");
            document.querySelector(".theme-btn").textContent = "☀️";
          } else {
            document.body.classList.remove("dark");
            document.querySelector(".theme-btn").textContent = "🌙";
          }
        }
      });
    }

    // 滚动渐入
    function setupReveal() {
      const reveals = document.querySelectorAll(".reveal");
      if (!reveals.length) return;
      if (!("IntersectionObserver" in window)) {
        reveals.forEach(el => el.classList.add("visible"));
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });
      reveals.forEach(el => observer.observe(el));
    }

    async function init() {
      renderPosts(DEFAULT_POSTS, "");
      try {
        const res = await fetch("/api/posts");
        if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
          const posts = await res.json();
          if (Array.isArray(posts)) {
            allPosts = posts;
            renderPosts(allPosts, currentQuery);
          }
        }
      } catch(e) {}
      try {
        const sRes = await fetch("/api/site");
        if (sRes.ok && (sRes.headers.get("content-type") || "").includes("json")) {
          const s = await sRes.json();
          if (s && typeof s.title === "string") {
            document.title = `博客 - ${s.title}`;
            document.getElementById("nav-logo").textContent = s.title;
            document.getElementById("footer-text").textContent = s.footer;
          }
        }
      } catch(e) {}
      setupReveal();
    }
    init();
  </script>
<script src="music-player.js" defer></script>
</body>
</html>
