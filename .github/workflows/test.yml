name: 全链路测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 全链路回归（PWA / 内容 / SEO·CSP / a11y / 压测）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 npm 依赖（跳过浏览器下载）
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci

      - name: 安装 Playwright Chromium 及系统依赖
        run: npx playwright install --with-deps chromium

      # v19.0：用压缩构建产出 dist/public/build。既有 33 套件对 dist 只做存在性
      # 检查，step29 A7c 与 step30 校验压缩产物等价性；build:opt 需 esbuild，
      # 故本 Job 已有 npm ci。压缩保持物理路径与全局契约不变。
      - name: 构建静态产物并压缩（step29 A7c / step30 前置）
        run: npm run build:opt

      - name: 运行全链路测试（34 个套件，含 v17.0 按需加载与 v19.0 工程化门禁）
        run: npm test
        env:
          CI: true
