name: 全链路测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 全链路回归（PWA / 内容 / SEO·CSP / a11y / 压测）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 npm 依赖（跳过浏览器下载）
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci

      - name: 安装 Playwright Chromium 及系统依赖
        run: npx playwright install --with-deps chromium

      - name: 运行全链路测试（8 个套件）
        run: npm test
        env:
          CI: true
