name: CI 检查（Lint + Build）

# 步骤 1.3：PR 时的基础质量门禁——Linter 与构建检查，防止坏代码合并。
# 本 Job 不依赖 npm 包（仅用 Node 内置能力），秒级完成；
# 全量回归由 test.yml 承担，两者互补。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-build:
    name: Lint 与构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint — JS 语法检查（.mjs / 站点 .js / _worker.js 按 ES 模块校验）
        run: |
          set -u
          fail=0
          # ES 模块（.mjs）直接校验
          for f in $(git ls-files '*.mjs'); do
            node --check "$f" || { echo "::error file=$f::语法错误"; fail=1; }
          done
          # 站点脚本（.js，非 _worker.js）按 CommonJS 校验
          for f in $(git ls-files '*.js' | grep -v '^_worker\.js$'); do
            node --check "$f" || { echo "::error file=$f::语法错误"; fail=1; }
          done
          # _worker.js 是 ES 模块（export default），用 .mjs 副本校验
          if git ls-files --error-unmatch _worker.js >/dev/null 2>&1; then
            cp _worker.js ._lint_worker.mjs
            node --check ._lint_worker.mjs || { echo "::error file=_worker.js::语法错误"; fail=1; }
            rm -f ._lint_worker.mjs
          fi
          if [ "$fail" -eq 0 ]; then echo "✅ 所有 JS 语法检查通过"; else exit 1; fi

      - name: Build — 生成静态产物（dist/）
        run: node scripts/build-pages.mjs

      # v15.0 修正：v7.0 起页面下沉 pages/、样式下沉 styles/，
      # 旧的 dist/index.html / dist/common.css 断言早已失效（本门禁仅在
      # PR / 手动触发时运行，故长期未暴露）。此处对齐 deploy.yml 的真实
      # 目录结构，并补上工具箱关键产物，避免校验形同虚设。
      - name: 校验构建产物
        run: |
          test -f dist/pages/index.html || { echo "::error::缺少 dist/pages/index.html"; exit 1; }
          test -f dist/pages/tools.html || { echo "::error::缺少 dist/pages/tools.html"; exit 1; }
          test -f dist/_worker.js || { echo "::error::缺少 dist/_worker.js（Pages 高级模式需要）"; exit 1; }
          test -f dist/styles/common.css || { echo "::error::缺少 dist/styles/common.css"; exit 1; }
          test -f dist/styles/toolbox.css || { echo "::error::缺少 dist/styles/toolbox.css"; exit 1; }
          test -f dist/components/toolbox.js || { echo "::error::缺少 dist/components/toolbox.js"; exit 1; }
          test -f dist/utils/toolbox-pure.js || { echo "::error::缺少 dist/utils/toolbox-pure.js"; exit 1; }
          test -f dist/manifest.json || { echo "::error::缺少 dist/manifest.json"; exit 1; }
          echo "✅ dist/ 产物校验通过（顶层 $(ls dist | wc -l) 个条目）"

      # v17.0 模块四：把架构审计与按需加载测试纳入门禁。
      # 两者只用 Node 内置能力，无需 npm ci；step29 检测不到 Playwright 时
      # 自动只跑静态段，故本 Job 秒级完成且不会因缺浏览器而报红。
      - name: 架构审计（Feature 域 / 依赖图 / 死代码 / 零调试输出）
        run: npm run audit:arch

      - name: 按需加载与 EventBus 门禁（step29 静态段）
        run: node tests/step29-v17-toolbox.mjs

      - name: 校验 v17.0 产物（ESM 分片 / 全局 EventBus / 微信验证文件）
        run: |
          test -f dist/modules/toolbox/manifest.js || { echo "::error::缺少 ESM 分片清单"; exit 1; }
          test -f dist/modules/toolbox/regex.js || { echo "::error::缺少 regex 分片"; exit 1; }
          test -f dist/utils/event-bus.js || { echo "::error::缺少全局 EventBus"; exit 1; }
          test -f dist/4874997fe38afa094805abd462d246f8.txt || { echo "::error::缺少微信域名验证文件"; exit 1; }
          echo "✅ v17.0 产物校验通过"
