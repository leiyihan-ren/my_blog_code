    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.1);
    --nav-bg: rgba(255,255,255,0.85);
    --item-bg: rgba(79,70,229,0.06);


  }
  body.dark {
    --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.5);
    --nav-bg: rgba(15,15,26,0.85);
    --item-bg: rgba(99,102,241,0.12);

  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.3s var(--ease), color 0.3s var(--ease); padding-bottom: 70px; overflow-wrap: break-word;}
  .navbar {
    background: var(--nav-bg); position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid transparent; transition: all 0.3s var(--ease);
  }
  .navbar.scrolled {
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }
  body.dark .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.2); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb),0.3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(var(--primary-rgb),0.5); }
  ::selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
  .nav-inner {
    max-width: 1080px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between; height: 64px;
  }
  .logo {
    font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none;
    background: var(--grad-brand);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    white-space: nowrap;
    transition: opacity 0.2s var(--ease);
  }
    .logo:hover { opacity: 0.85; }
  .nav-right { display: flex; align-items: center; gap: 12px; }
  .nav-links { display: flex; gap: 20px; list-style: none; }
  .nav-links a {
    color: var(--text-light); text-decoration: none; font-size: 15px;
    transition: color 0.2s var(--ease); position: relative; white-space: nowrap;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--primary-text); }
  .nav-links a.active::after {
    content: ""; position: absolute; bottom: -6px; left: 0; right: 0;
    height: 2px; background: var(--primary); border-radius: 2px;
  }
  .theme-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--card-bg); color: var(--text); cursor: pointer;
    font-size: 16px; transition: all 0.2s var(--ease); box-shadow: var(--card-shadow);
  }
  .theme-btn:hover { transform: scale(1.1); }
  .nav-toggle { display: none; width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0; }
  .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s var(--ease); }
  .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.active span:nth-child(2) { opacity: 0; }
  .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 0; z-index: 99; }
  .mobile-menu.active { display: block; }
  .mobile-menu a { display: block; padding: 13px 24px; color: var(--text-light); text-decoration: none; font-size: 16px; transition: all 0.2s var(--ease); }
  .mobile-menu a:hover, .mobile-menu a.active { color: var(--primary-text); background: var(--item-bg); }

  .container { max-width: 1080px; margin: 0 auto; padding: 44px 24px; }
  .page-header { margin-bottom: 26px; }
  .page-title { font-size: 28px; font-weight: 700; }
  .page-sub { font-size: 14px; color: var(--text-mute); margin-top: 6px; }

  .link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .link-card {
    display: flex; gap: 14px; align-items: flex-start; text-decoration: none;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; transition: all 0.25s var(--ease); position: relative; overflow: hidden;
  }
  /* 顶部渐变条：悬停时展开（全站卡片统一设计语言） */
  .link-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--brand-from), var(--brand-to));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s var(--ease);
  }
  .link-card:hover::before { transform: scaleX(1); }
  .link-card:hover { transform: translateY(-4px); box-shadow: var(--card-shadow-hover); border-color: var(--primary-text); }
  .link-avatar {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700;
    background: var(--grad-brand); color: var(--on-accent);
  }
  .link-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .link-info { min-width: 0; flex: 1; }
  .link-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .link-desc { font-size: 13px; color: var(--text-light); line-height: 1.6; word-break: break-all; }
  .link-arrow { color: var(--text-mute); font-size: 18px; transition: transform 0.25s var(--ease), color 0.25s var(--ease); flex-shrink: 0; }
  .link-card:hover .link-arrow { transform: translateX(3px); color: var(--primary-text); }
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px;
    color: var(--text-mute); background: var(--card-bg);
    border: 1px dashed var(--border); border-radius: 18px;
  }
  .empty .ico { font-size: 40px; display: block; margin-bottom: 12px; }

  .apply {
    margin-top: 28px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 26px; box-shadow: var(--card-shadow);
  }
  .apply h2 { font-size: 19px; margin-bottom: 6px; }
  .apply > p { font-size: 14px; color: var(--text-light); margin-bottom: 18px; }
  .apply-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .apply-item {
    background: var(--item-bg); border-radius: 12px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .apply-item span { font-size: 12px; color: var(--text-mute); }
  .apply-item b { font-size: 14px; font-weight: 600; word-break: break-all; }
  .apply-note {
    margin-top: 16px; font-size: 13px; color: var(--text-light);
    line-height: 1.8; background: var(--item-bg); border-radius: 12px; padding: 14px 16px;
  }
  .apply-note b { color: var(--text); }
  .btn {
    border: none; border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.2s var(--ease);
    background: var(--primary); color: var(--on-accent);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-light); }
  .apply-actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }

  .footer { text-align: center; padding: 40px 24px; color: var(--text-mute); font-size: 13px; border-top: 1px solid var(--border); }



  @media (max-width: 900px) {
    .nav-links { display: none; }
    .nav-toggle { display: flex; }
    .container { padding: 30px 18px; }
    .page-title { font-size: 23px; }
  }

    /* 可访问性：键盘焦点清晰可见 */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    /* 尊重系统减弱动效偏好：关闭装饰性动画与过渡 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* 交互反馈：按下态（opacity 方案，避免与组件既有 transform 冲突） */
    a:active, button:active, [role="button"]:active,
    .game-card:active, .post-card:active, .link-card:active, .timeline-item:active,
    .rank-tab:active, .tab:active, .opt-btn:active { opacity: 0.85; }
  </style>
</head>

<script>
  const { escapeHtml, escapeAttr, toast } = window.BlogUtils;
"use strict";
const $ = (id) => document.getElementById(id);



/* ---------- 渲染友链 ---------- */
function renderLinks(links) {
  const grid = $("link-grid");
  if (!links.length) {
    grid.innerHTML = `<div class="empty"><span class="ico" aria-hidden="true">🌱</span>还没有友链，成为第一个吧！</div>`;
  } else {
    grid.innerHTML = links.map(l => {
      const name = escapeHtml(l.name || "未命名");
      const initial = escapeHtml((l.name || "?").trim().charAt(0).toUpperCase());
      const avatar = l.icon
        ? `<img src="${escapeAttr(l.icon)}" alt="${name}" loading="lazy" data-fallback="${initial}">`
        : initial;
      return `
      <a class="link-card" href="${escapeAttr(l.url)}" target="_blank" rel="noopener noreferrer nofollow">
        <div class="link-avatar">${avatar}</div>
        <div class="link-info">
          <div class="link-name">${name}</div>
          <div class="link-desc">${escapeHtml(l.desc || l.url)}</div>
        </div>
        <div class="link-arrow">→</div>
      </a>`;
    }).join("");
    // 头像加载失败时回退为首字母（事件绑定代替内联 onerror，避免注入面）
    grid.querySelectorAll("img[data-fallback]").forEach(img => {
      img.addEventListener("error", function() {
        this.parentNode.textContent = this.dataset.fallback;
        this.parentNode.classList.add("fallback");
      });
    });
  }
  $("link-count").textContent = `共 ${links.length} 个友链`;
}

/* ---------- 站点信息 ---------- */
let siteInfo = null;
function renderSite(s) {
  siteInfo = s;
  const host = location.host || "example.com";
  $("ap-name").textContent = s.title || document.title;
  $("ap-url").textContent = location.origin + "/";
  $("ap-desc").textContent = s.bio || "欢迎交换友链";
  $("ap-email").textContent = s.email || "未设置邮箱";
}

$("btn-copy").addEventListener("click", async () => {
  const s = siteInfo || {};
  const text =
    `站点名称：${s.title || document.title}\n` +
    `站点地址：${location.origin}/\n` +
    `站点描述：${s.bio || ""}\n` +
    `联系邮箱：${s.email || "未设置"}`;
  try {
    await navigator.clipboard.writeText(text);
    toast("站点信息已复制到剪贴板 ✅");
  } catch (e) {
    // 剪贴板不可用时降级为弹窗选择
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("站点信息已复制 ✅"); }
    catch (e2) { toast("复制失败，请手动记录"); }
    document.body.removeChild(ta);
  }
});

$("btn-mail").addEventListener("click", () => {
  const s = siteInfo || {};
  const email = s.email || "";
  if (!email) { toast("站长未设置联系邮箱"); return; }
  const subject = encodeURIComponent("友链申请");
  const body = encodeURIComponent(
    `你好，我想和你交换友链：\n\n站点名称：\n站点地址：\n站点描述：\n\n我已添加你的站点：${location.origin}/\n`
  );
  location.href = `mailto:${email}?subject=${subject}&body=${body}`;
});

/* ---------- 启动 ---------- */
(async function init() {
  try {
    const res = await fetch("/api/links");
    if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
      const list = await res.json();
      renderLinks(Array.isArray(list) ? list : []);
    } else {
      renderLinks([]);
    }
  } catch (e) { renderLinks([]); }

  try {
    const res = await fetch("/api/site");
    if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
      const s = await res.json();
      if (s && typeof s.title === "string") {
        document.title = `友情链接 - ${s.title}`;
        $("nav-logo").textContent = s.title;
        $("footer-text").textContent = s.footer;
        renderSite(s);
      }
    }
  } catch (e) {}
})();
</script>
