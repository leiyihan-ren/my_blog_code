    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.1);
      --nav-bg: rgba(255,255,255,0.85);


    }
    body.dark {
      --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.5);
      --nav-bg: rgba(15,15,26,0.85);

    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      transition: background 0.3s var(--ease), color 0.3s var(--ease);
      padding-bottom: 70px; overflow-wrap: break-word;}
    .navbar {
      background: var(--nav-bg);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid transparent;
      transition: all 0.3s var(--ease);
    }
    .navbar.scrolled {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0,0,0,0.04);
    }
    body.dark .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.2); }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb),0.3); border-radius: 4px; transition: background 0.2s var(--ease); }
    ::-webkit-scrollbar-thumb:hover { background: rgba(var(--primary-rgb),0.5); }
    body.dark::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb),0.3); }
    body.dark::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb),0.5); }

    /* 文字选中样式 */
    ::selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
    ::-moz-selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
    body.dark ::selection { background: rgba(var(--accent-rgb),0.4); color: var(--on-accent); }
    body.dark ::-moz-selection { background: rgba(var(--accent-rgb),0.4); color: var(--on-accent); }
    .nav-inner {
      max-width: 960px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .logo {
      font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none;
      background: var(--grad-brand);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      transition: opacity 0.2s var(--ease);
    }
    .logo:hover { opacity: 0.85; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--text-light); text-decoration: none; font-size: 15px;
      transition: color 0.2s var(--ease); position: relative;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary-text); }
    .nav-links a.active::after {
      content: ""; position: absolute; bottom: -6px; left: 0; right: 0;
      height: 2px; background: var(--primary); border-radius: 2px;
    }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--card-bg); color: var(--text); cursor: pointer;
      font-size: 16px; transition: all 0.2s var(--ease); box-shadow: var(--card-shadow);
    }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn:active { transform: scale(0.97); }
    .btn-primary:active { transform: scale(0.97); }
    .container { max-width: 720px; margin: 0 auto; padding: 50px 24px; }
    .page-title {
      font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 24px;
    }
    .form-card {
      background: var(--card-bg); border-radius: 18px; padding: 28px;
      box-shadow: var(--card-shadow); margin-bottom: 32px;
      border: 1px solid var(--border);
    }
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-row input { flex: 1; }
    input, textarea {
      width: 100%; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: 12px;
      font-size: 15px; font-family: inherit; outline: none;
      transition: border 0.2s var(--ease);
      background: var(--card-bg); color: var(--text);
    }
    input:focus, textarea:focus {
      border-color: var(--primary-text);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb),0.1);
    }
    textarea { resize: vertical; min-height: 110px; margin-bottom: 14px; }
    .btn {
      padding: 12px 28px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s var(--ease); font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: var(--on-accent); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(var(--primary-rgb),0.3); }
    .btn-primary:disabled { background: var(--primary-disabled); cursor: not-allowed; transform: none; box-shadow: none; }
    .hint { font-size: 12px; color: var(--text-mute); margin-left: 12px; }
    .submit-row { display: flex; align-items: center; }
    .msg-card {
      background: var(--card-bg); border-radius: 16px; padding: 22px 26px;
      margin-bottom: 14px; box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      transition: all 0.3s var(--ease);
      opacity: 0;
      transform: translateY(20px);
    }
    .msg-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .msg-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--primary-text);
    }
    .msg-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px;
    }
    /* 生成头像：昵称首字母 + 确定性哈希色（JS 设 --msg-h），纯装饰 */
    .msg-avatar {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 16px; font-weight: 700; line-height: 1;
      background: hsl(var(--msg-h, 250) 70% 92%);
      color: hsl(var(--msg-h, 250) 65% 32%);
      user-select: none;
    }
    body.dark .msg-avatar {
      background: hsl(var(--msg-h, 250) 45% 24%);
      color: hsl(var(--msg-h, 250) 70% 74%);
    }
    .msg-name { font-weight: 600; color: var(--primary-text); font-size: 15px; min-width: 0; overflow-wrap: anywhere; margin-right: auto; }
    .msg-date { font-size: 12px; color: var(--text-mute); flex-shrink: 0; }
    .msg-content {
      color: var(--text); font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg-count {
      font-size: 14px; color: var(--text-mute); margin-bottom: 16px;
    }
    .empty {
      text-align: center; padding: 50px 20px; color: var(--text-mute);
      background: var(--card-bg); border-radius: 16px;
      border: 1px solid var(--border);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .alert {
      padding: 12px 16px; border-radius: 10px; font-size: 14px;
      margin-bottom: 14px; display: none;
    }
    .alert-success { background: var(--success-bg); color: var(--success-text); display: block; }
    .alert-error { background: var(--danger-bg); color: var(--danger-text); display: block; }
    .footer {
      text-align: center; padding: 40px 24px; color: var(--text-mute);
      font-size: 13px; border-top: 1px solid var(--border);
      /* CLS 防护：site.footer 动态注入可能换行，预留两行高度避免布局位移 */
      min-height: 102px;
    }
    .nav-toggle { display: none; width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s var(--ease); }
    .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 0; z-index: 99; animation: slideDown 0.25s var(--ease); }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu.active { display: block; }
    .mobile-menu a { display: block; padding: 14px 24px; color: var(--text-light); text-decoration: none; font-size: 16px; transition: all 0.2s var(--ease); }
    .mobile-menu a:hover, .mobile-menu a.active { color: var(--primary-text); background: var(--item-bg, rgba(var(--primary-rgb),0.06)); }
    @media (max-width: 900px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .page-title { font-size: 22px; }
      .form-card { padding: 22px; }
      .form-row { flex-direction: column; gap: 14px; }
      .container { padding: 36px 20px; }
    }
  
    /* 可访问性：键盘焦点清晰可见 */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    /* 尊重系统减弱动效偏好：关闭装饰性动画与过渡 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* 交互反馈：按下态（opacity 方案，避免与组件既有 transform 冲突） */
    a:active, button:active, [role="button"]:active,
    .game-card:active, .post-card:active, .link-card:active, .timeline-item:active,
    .rank-tab:active, .tab:active, .opt-btn:active { opacity: 0.85; }
  </style>

<script>
  // 同步应用主题：避免暗色模式首屏白闪（FOUC）。与页尾 initTheme 逻辑保持一致
  try {
    var __t = localStorage.getItem("theme");
    var __dark = __t === "dark" || (!__t && matchMedia("(prefers-color-scheme: dark)").matches);
    if (__dark) {
      document.body.classList.add("dark");

    // 主题色同步：移动端地址栏/状态栏颜色与首屏主题一致（后续手动切换由 common.js 接管）
    var __tc = document.querySelector('meta[name="theme-color"]:not([media])');
    if (__tc) __tc.setAttribute("content", __dark ? "#0f0f1a" : "#4f46e5");
  } catch (e) {}
</script>

    <h1 class="page-title">💬 留言板</h1>

    <div class="form-card">
      <div class="alert" id="form-alert"></div>
      <div class="form-row">
        <input type="text" id="msg-name" placeholder="你的昵称（最多20字）" maxlength="20" aria-label="你的昵称">

  <script>
  const { escapeHtml } = window.BlogUtils;



    document.getElementById("msg-content").addEventListener("input", function() {
      document.getElementById("char-count").textContent = this.value.length + " / 500";
    });
    // 初始化字符计数
    document.getElementById("char-count").textContent =
      document.getElementById("msg-content").value.length + " / 500";

    function showAlert(msg, type) {
      const el = document.getElementById("form-alert");
      el.textContent = msg;
      el.className = "alert alert-" + type;
      el.style.display = "";  // 清除 inline display:none
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    function formatDate(dateStr) {
      return window.BlogUtils.formatRelativeDate(dateStr);
      }

    function renderMessages(list) {
      const el = document.getElementById("msg-list");
      document.getElementById("msg-count").textContent = "共 " + list.length + " 条留言";
      if (list.length === 0) {
        el.innerHTML = '<div class="empty">还没有人留言，来抢沙发吧~ ✨</div>';
        return;
      }
      el.innerHTML = list.map((m, i) => {
        // 生成头像：取昵称首字符（按码点取，防代理对截断），色相由昵称哈希决定
        const nameStr = String(m.name || "");
        const initial = Array.from(nameStr)[0] || "?";
        let h = 0;
        for (const ch of nameStr) h = (h * 31 + ch.codePointAt(0)) % 360;
        return `
        <div class="msg-card" data-delay="${i}">
          <div class="msg-header">
            <span class="msg-avatar" style="--msg-h:${h}" aria-hidden="true">${escapeHtml(initial)}</span>
            <span class="msg-name">${escapeHtml(m.name)}</span>
            <span class="msg-date">${formatDate(m.date)}</span>
          </div>
          <div class="msg-content">${escapeHtml(m.content)}</div>
        </div>`;
      }).join("");

      // 滚动渐入
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const delay = parseInt(entry.target.dataset.delay || "0", 10);
              entry.target.style.transitionDelay = (delay * 0.05) + "s";
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05 });
        el.querySelectorAll(".msg-card").forEach(card => observer.observe(card));
      } else {
        el.querySelectorAll(".msg-card").forEach(card => card.classList.add("visible"));
      }
    }

    async function submitMsg() {
      const name = document.getElementById("msg-name").value.trim();
      const content = document.getElementById("msg-content").value.trim();
      if (!name) { showAlert("请输入昵称", "error"); return; }
      if (name.length > 20) { showAlert("昵称不能超过20字", "error"); return; }
      // 昵称必须包含至少一个可视字符
      if (!/[\u4e00-\u9fa5a-zA-Z0-9]/.test(name)) {
        showAlert("昵称需要包含文字或数字", "error"); return;
      }
      if (!content) { showAlert("请输入留言内容", "error"); return; }
      if (content.length > 500) { showAlert("留言不能超过500字", "error"); return; }
      // 限制连续换行
      if (/\n{6,}/.test(content)) {
        showAlert("连续换行太多了，请精简一下", "error"); return;
      }

      const btn = document.getElementById("submit-btn");
      if (btn.disabled) return; // 防重复提交
      btn.disabled = true;
      btn.textContent = "发送中...";

      try {
        const res = await fetch("/api/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, content })
        });
        const result = await res.json();
        if (result.success) {
          showAlert("留言成功！感谢你的留言 🎉", "success");
          document.getElementById("msg-content").value = "";
          document.getElementById("char-count").textContent = "0 / 500";
          loadMessages();
        } else {
          showAlert(result.error || "发送失败", "error");
        }
      } catch(e) {
        showAlert("网络错误，请稍后重试", "error");
      }

      btn.disabled = false;
      btn.textContent = "发送留言";
    }

    // 请求序号：防止 30 秒轮询的旧响应覆盖刚提交后的新列表
    let msgReqSeq = 0;
    async function loadMessages() {
      const mySeq = ++msgReqSeq;
      try {
        const res = await fetch("/api/messages");
        if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
          const list = await res.json();
          if (mySeq !== msgReqSeq) return; // 已有更新的请求
          if (Array.isArray(list)) { renderMessages(list); return; }
        }
      } catch(e) {}
      if (mySeq !== msgReqSeq) return;
      renderMessages([]);
    }

    async function init() {
      loadMessages();
      // 每30秒自动刷新留言
      setInterval(loadMessages, 30000);
      try {
        const sRes = await fetch("/api/site");
        if (sRes.ok && (sRes.headers.get("content-type") || "").includes("json")) {
          const s = await sRes.json();
          if (s && typeof s.title === "string") {
            document.title = `留言板 - ${s.title}`;
            document.getElementById("nav-logo").textContent = s.title;
            document.getElementById("footer-text").textContent = s.footer;
          }
        }
      } catch(e) {}
    }
    init();
  </script>
