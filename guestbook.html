<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="留下你的想法与建议，欢迎来访客留言板交流。">

  <meta property="og:site_name" content="我的博客">
  <meta property="og:title" content="留言板 - 我的博客">

  <title>留言板 - 我的博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8f9ff; --card-bg: #ffffff; --text: #333; --text-light: #666;
      --text-mute: #6b7280; --border: #eaecef; --primary: #4f46e5;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.04);
      --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.1);
      --nav-bg: rgba(255,255,255,0.85);

      --primary-rgb: 79,70,229;
      --accent-rgb: 99,102,241;
      --brand-from: #667eea;
      --brand-to: #764ba2;
      --brand-rgb: 102,126,234;
      --success-rgb: 22,163,74;
      --warning-rgb: 245,158,11;
      --danger-rgb: 239,68,68;
      --on-accent: #fff;
      --primary-hover: #4338ca;
      --brand-deep: #5b21b6;
      --grad-brand: linear-gradient(135deg, var(--brand-from), var(--brand-to));
      --success: #16a34a;
      --success-bg: #dcfce7;
      --success-text: #166534;
      --danger: #dc2626;
      --danger-solid: #ef4444;
      --danger-bg: #fee2e2;
      --danger-text: #991b1b;
      --warning: #d97706;
      --warning-strong: #b45309;
      --warning-bg: #fef3c7;
      --warning-text: #92400e;
      --radius-pill: 999px;
      --primary-disabled: #a5b4fc;
    }
    body.dark {
      --bg: #0f0f1a; --card-bg: #1a1a2e; --text: #e5e7eb; --text-light: #9ca3af;
      --text-mute: #9ca3af; --border: #2a2a40;
      --card-shadow: 0 2px 12px rgba(0,0,0,0.3);
      --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.5);
      --nav-bg: rgba(15,15,26,0.85);

      --success: #22c55e;
      --success-bg: rgba(34,197,94,0.16);
      --success-text: #86efac;
      --danger: #fca5a5;
      --danger-bg: rgba(239,68,68,0.16);
      --danger-text: #fca5a5;
      --warning: #fbbf24;
      --warning-strong: #fbbf24;
      --warning-bg: rgba(251,191,36,0.14);
      --warning-text: #fcd34d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      transition: background 0.3s, color 0.3s;
      padding-bottom: 70px;
    }
    .navbar {
      background: var(--nav-bg);
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid transparent;
      transition: all 0.3s ease;
    }
    .navbar.scrolled {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0,0,0,0.04);
    }
    body.dark .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.2); }

    /* 自定义滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb),0.3); border-radius: 4px; transition: background 0.2s; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(var(--primary-rgb),0.5); }
    body.dark::-webkit-scrollbar-thumb { background: rgba(var(--accent-rgb),0.3); }
    body.dark::-webkit-scrollbar-thumb:hover { background: rgba(var(--accent-rgb),0.5); }

    /* 文字选中样式 */
    ::selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
    ::-moz-selection { background: rgba(var(--primary-rgb),0.3); color: var(--on-accent); }
    body.dark ::selection { background: rgba(var(--accent-rgb),0.4); color: var(--on-accent); }
    body.dark ::-moz-selection { background: rgba(var(--accent-rgb),0.4); color: var(--on-accent); }
    .nav-inner {
      max-width: 960px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .logo {
      font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none;
      background: var(--grad-brand);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      color: var(--text-light); text-decoration: none; font-size: 15px;
      transition: color 0.2s; position: relative;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--primary); }
    .nav-links a.active::after {
      content: ""; position: absolute; bottom: -6px; left: 0; right: 0;
      height: 2px; background: var(--primary); border-radius: 2px;
    }
    .theme-btn {
      width: 36px; height: 36px; border-radius: 50%; border: none;
      background: var(--card-bg); color: var(--text); cursor: pointer;
      font-size: 16px; transition: all 0.2s; box-shadow: var(--card-shadow);
    }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn:active { transform: scale(0.97); }
    .back-top:active { transform: scale(0.92); }
    .btn-primary:active { transform: scale(0.97); }
    .container { max-width: 720px; margin: 0 auto; padding: 50px 24px; }
    .page-title {
      font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 24px;
    }
    .form-card {
      background: var(--card-bg); border-radius: 18px; padding: 28px;
      box-shadow: var(--card-shadow); margin-bottom: 32px;
      border: 1px solid var(--border);
    }
    .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
    .form-row input { flex: 1; }
    input, textarea {
      width: 100%; padding: 12px 16px;
      border: 2px solid var(--border); border-radius: 12px;
      font-size: 15px; font-family: inherit; outline: none;
      transition: border 0.2s;
      background: var(--card-bg); color: var(--text);
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(var(--primary-rgb),0.1);
    }
    textarea { resize: vertical; min-height: 110px; margin-bottom: 14px; }
    .btn {
      padding: 12px 28px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: var(--on-accent); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(var(--primary-rgb),0.3); }
    .btn-primary:disabled { background: var(--primary-disabled); cursor: not-allowed; transform: none; box-shadow: none; }
    .hint { font-size: 12px; color: var(--text-mute); margin-left: 12px; }
    .submit-row { display: flex; align-items: center; }
    .msg-card {
      background: var(--card-bg); border-radius: 16px; padding: 22px 26px;
      margin-bottom: 14px; box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(20px);
    }
    .msg-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .msg-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--card-shadow-hover);
      border-color: var(--primary);
    }
    .msg-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .msg-name { font-weight: 600; color: var(--primary); font-size: 15px; }
    .msg-date { font-size: 12px; color: var(--text-mute); }
    .msg-content {
      color: var(--text); font-size: 14px; line-height: 1.7;
      white-space: pre-wrap; word-wrap: break-word;
    }
    .msg-count {
      font-size: 14px; color: var(--text-mute); margin-bottom: 16px;
    }
    .empty {
      text-align: center; padding: 50px 20px; color: var(--text-mute);
      background: var(--card-bg); border-radius: 16px;
      border: 1px solid var(--border);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .alert {
      padding: 12px 16px; border-radius: 10px; font-size: 14px;
      margin-bottom: 14px; display: none;
    }
    .alert-success { background: var(--success-bg); color: var(--success-text); display: block; }
    .alert-error { background: var(--danger-bg); color: var(--danger-text); display: block; }
    .footer {
      text-align: center; padding: 40px 24px; color: var(--text-mute);
      font-size: 13px; border-top: 1px solid var(--border);
    }
    .back-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-accent);
      border: none;
      cursor: pointer;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(var(--primary-rgb),0.4);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 99;
    }
    .back-top.show {
      opacity: 1;
      transform: translateY(0);
    }
    .back-top:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(var(--primary-rgb),0.5);
    }
    .nav-toggle { display: none; width: 36px; height: 36px; border: none; background: transparent; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 0; }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s; }
    .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--nav-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 0; z-index: 99; animation: slideDown 0.25s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .mobile-menu.active { display: block; }
    .mobile-menu a { display: block; padding: 14px 24px; color: var(--text-light); text-decoration: none; font-size: 16px; transition: all 0.2s; }
    .mobile-menu a:hover, .mobile-menu a.active { color: var(--primary); background: var(--item-bg, rgba(var(--primary-rgb),0.06)); }
    @media (max-width: 900px) {
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .page-title { font-size: 22px; }
      .form-card { padding: 22px; }
      .form-row { flex-direction: column; gap: 14px; }
      .container { padding: 36px 20px; }
      .back-top { bottom: 90px; right: 20px; width: 42px; height: 42px; }
    }
  
    /* 可访问性：键盘焦点清晰可见 */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    /* 尊重系统减弱动效偏好：关闭装饰性动画与过渡 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
</style>
</head>
<body>
<script>
  // 同步应用主题：避免暗色模式首屏白闪（FOUC）。与页尾 initTheme 逻辑保持一致
  try {
    var __t = localStorage.getItem("theme");
    if (__t === "dark" || (!__t && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.body.classList.add("dark");
    }
  } catch (e) {}
</script>
<main>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" id="nav-logo">我的博客</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="index.html">首页</a></li>
          <li><a href="blog.html">博客</a></li>
          <li><a href="album.html">相册</a></li>
          <li><a href="timeline.html">时间线</a></li>
          <li><a href="guestbook.html" class="active">留言</a></li>
          <li><a href="games.html">游戏</a></li>
          <li><a href="links.html">友链</a></li>
        </ul>
        <button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单"><span></span><span></span><span></span></button>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">首页</a>
    <a href="blog.html">博客</a>
    <a href="album.html">相册</a>

  <div class="container">
    <h1 class="page-title">💬 留言板</h1>

    <div class="form-card">
      <div class="alert" id="form-alert"></div>
      <div class="form-row">
        <input type="text" id="msg-name" placeholder="你的昵称（最多20字）" maxlength="20" aria-label="你的昵称">
      </div>
      <textarea id="msg-content" placeholder="想说点什么...（最多500字）" maxlength="500" aria-label="留言内容"></textarea>
      <div class="submit-row">
        <button class="btn btn-primary" id="submit-btn" onclick="submitMsg()">发送留言</button>
        <span class="hint" id="char-count">0 / 500</span>
      </div>
    </div>

    <div class="msg-count" id="msg-count">共 0 条留言</div>
    <div id="msg-list"></div>
  </div>

  </main>

  <footer class="footer" id="footer-text">© 2026 Lei Yihan</footer>

  <script>
    // 安全的 localStorage 读写（隐私模式/存储被禁用的浏览器不抛错）
    const safeStorage = {
      get(key) { try { return localStorage.getItem(key); } catch(e) { return null; } },
      set(key, val) { try { localStorage.setItem(key, val); } catch(e) {} }
    };

    function toggleTheme() {
      document.body.classList.toggle("dark");
      safeStorage.set("theme", document.body.classList.contains("dark") ? "dark" : "light");
      document.querySelector(".theme-btn").textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
    }
    (function() {
      const s = safeStorage.get("theme");
      const d = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (s === "dark" || (!s && d)) { document.body.classList.add("dark"); document.querySelector(".theme-btn").textContent = "☀️"; }
    })();

    // 移动端菜单
    (function() {
      const t = document.getElementById("navToggle"), m = document.getElementById("mobileMenu");
      if (!t || !m) return;
      t.addEventListener("click", () => { t.classList.toggle("active"); m.classList.toggle("active"); });
      m.querySelectorAll("a").forEach(a => a.addEventListener("click", () => { t.classList.remove("active"); m.classList.remove("active"); }));
      document.addEventListener("click", e => {
        if (!e.target.closest(".nav-right") && !e.target.closest("#mobileMenu")) { t.classList.remove("active"); m.classList.remove("active"); }
      });
    })();

    document.getElementById("msg-content").addEventListener("input", function() {
      document.getElementById("char-count").textContent = this.value.length + " / 500";
    });
    // 初始化字符计数
    document.getElementById("char-count").textContent =
      document.getElementById("msg-content").value.length + " / 500";

    function showAlert(msg, type) {
      const el = document.getElementById("form-alert");
      el.textContent = msg;
      el.className = "alert alert-" + type;
      el.style.display = "";  // 清除 inline display:none
      setTimeout(() => { el.style.display = "none"; }, 3000);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) return "刚刚";
      if (diff < 3600000) return Math.floor(diff / 60000) + " 分钟前";
      if (diff < 86400000) return Math.floor(diff / 3600000) + " 小时前";
      if (diff < 2592000000) return Math.floor(diff / 86400000) + " 天前";
      return d.toLocaleDateString();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    function renderMessages(list) {
      const el = document.getElementById("msg-list");
      document.getElementById("msg-count").textContent = "共 " + list.length + " 条留言";
      if (list.length === 0) {
        el.innerHTML = '<div class="empty">还没有人留言，来抢沙发吧~ ✨</div>';
        return;
      }
      el.innerHTML = list.map((m, i) => `
        <div class="msg-card" data-delay="${i}">
          <div class="msg-header">
            <span class="msg-name">${escapeHtml(m.name)}</span>
            <span class="msg-date">${formatDate(m.date)}</span>
          </div>
          <div class="msg-content">${escapeHtml(m.content)}</div>
        </div>
      `).join("");

      // 滚动渐入
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const delay = parseInt(entry.target.dataset.delay || "0", 10);
              entry.target.style.transitionDelay = (delay * 0.05) + "s";
              entry.target.classList.add("visible");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05 });
        el.querySelectorAll(".msg-card").forEach(card => observer.observe(card));
      } else {
        el.querySelectorAll(".msg-card").forEach(card => card.classList.add("visible"));
      }
    }

    async function submitMsg() {
      const name = document.getElementById("msg-name").value.trim();
      const content = document.getElementById("msg-content").value.trim();
      if (!name) { showAlert("请输入昵称", "error"); return; }
      if (name.length > 20) { showAlert("昵称不能超过20字", "error"); return; }
      // 昵称必须包含至少一个可视字符
      if (!/[\u4e00-\u9fa5a-zA-Z0-9]/.test(name)) {
        showAlert("昵称需要包含文字或数字", "error"); return;
      }
      if (!content) { showAlert("请输入留言内容", "error"); return; }
      if (content.length > 500) { showAlert("留言不能超过500字", "error"); return; }
      // 限制连续换行
      if (/\n{6,}/.test(content)) {
        showAlert("连续换行太多了，请精简一下", "error"); return;
      }

      const btn = document.getElementById("submit-btn");
      if (btn.disabled) return; // 防重复提交
      btn.disabled = true;
      btn.textContent = "发送中...";

      try {
        const res = await fetch("/api/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, content })
        });
        const result = await res.json();
        if (result.success) {
          showAlert("留言成功！感谢你的留言 🎉", "success");
          document.getElementById("msg-content").value = "";
          document.getElementById("char-count").textContent = "0 / 500";
          loadMessages();
        } else {
          showAlert(result.error || "发送失败", "error");
        }
      } catch(e) {
        showAlert("网络错误，请稍后重试", "error");
      }

      btn.disabled = false;
      btn.textContent = "发送留言";
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function handleNavScroll() {
      const navbar = document.querySelector(".navbar");
      if (window.scrollY > 10) navbar.classList.add("scrolled");
      else navbar.classList.remove("scrolled");
    }
    let backTopTicking = false;
    window.addEventListener("scroll", () => {
      if (!backTopTicking) {
        requestAnimationFrame(() => {
          handleNavScroll();
          const btn = document.getElementById("backTop");
          btn.classList.toggle("show", window.scrollY > 300);
          backTopTicking = false;
        });
        backTopTicking = true;
      }
    });
    handleNavScroll();

    // 请求序号：防止 30 秒轮询的旧响应覆盖刚提交后的新列表
    let msgReqSeq = 0;
    async function loadMessages() {
      const mySeq = ++msgReqSeq;
      try {
        const res = await fetch("/api/messages");
        if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
          const list = await res.json();
          if (mySeq !== msgReqSeq) return; // 已有更新的请求
          if (Array.isArray(list)) { renderMessages(list); return; }
        }
      } catch(e) {}
      if (mySeq !== msgReqSeq) return;
      renderMessages([]);
    }

    async function init() {
      loadMessages();
      // 每30秒自动刷新留言
      setInterval(loadMessages, 30000);
      try {
        const sRes = await fetch("/api/site");
        if (sRes.ok && (sRes.headers.get("content-type") || "").includes("json")) {
          const s = await sRes.json();
          if (s && typeof s.title === "string") {
            document.title = `留言板 - ${s.title}`;
            document.getElementById("nav-logo").textContent = s.title;
            document.getElementById("footer-text").textContent = s.footer;
          }
        }
      } catch(e) {}
    }
    init();
  </script>

  <button class="back-top" onclick="scrollToTop()" id="backTop">↑</button>
<script src="music-player.js" defer></script>
</body>
