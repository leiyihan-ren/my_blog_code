<link rel="stylesheet" href="common.css">
    <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary-2: #7c3aed;
    --primary-2-rgb: 124,58,237;
    --overlay-bg: rgba(248,249,255,0.72);
    --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.1);
    --nav-bg: rgba(255,255,255,0.85);
    --item-bg: rgba(79,70,229,0.06);

    --tile-2: #eee4da;
    --tile-4: #ede0c8;
    --tile-8: #f2b179;
    --tile-16: #f59563;
    --tile-32: #f67c5f;
    --tile-64: #f65e3b;
    --tile-128: #edcf72;
    --tile-256: #edcc61;
    --tile-512: #edc850;
    --tile-1024: #edc53f;
    --tile-2048: #edc22e;
    --tile-big: #3c3a32;
    --tile-text: #776e65;
    --tile-2048-glow: 0 0 18px rgba(237,194,46,0.55);
    --game-blue: #3b82f6;
    --game-green: #22c55e;
    --game-red: #ef4444;
    --game-purple: #8b5cf6;
    --game-orange: #f97316;
    --game-cyan: #06b6d4;
    --game-gray: #374151;
    --game-gray-light: #9ca3af;

  }
  body.dark {
    --card-shadow-hover: 0 12px 32px rgba(0,0,0,0.5);
    --nav-bg: rgba(15,15,26,0.85);
    --item-bg: rgba(99,102,241,0.12);

  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background 0.3s var(--ease), color 0.3s var(--ease); padding-bottom: 70px; overflow-wrap: break-word;}
  .navbar {
    background: var(--nav-bg); position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid transparent; transition: all 0.3s var(--ease);
  }
  .navbar.scrolled {
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }
  body.dark .navbar.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.2); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(var(--primary-rgb),0.3); border-radius: 4px; }

  .nav-inner { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 19px; font-weight: 700; color: var(--text); text-decoration: none;
    transition: opacity 0.2s var(--ease);
  }
    .logo:hover { opacity: 0.85; }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .nav-links { display: flex; gap: 22px; list-style: none; }
  .nav-links a { color: var(--text-light); text-decoration: none; font-size: 15px; transition: color 0.2s var(--ease); }
  .nav-links a:hover, .nav-links a.active { color: var(--primary-text); }
  .theme-btn {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card-bg); cursor: pointer; font-size: 16px; transition: all 0.2s var(--ease);
  }
  .theme-btn:hover { transform: rotate(20deg); }
  .nav-toggle { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 6px; }
  .nav-toggle span { width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.3s var(--ease); }
  .nav-toggle.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav-toggle.active span:nth-child(2) { opacity: 0; }
  .nav-toggle.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .mobile-menu {
    display: none; flex-direction: column; background: var(--card-bg);
    border-bottom: 1px solid var(--border); padding: 10px 24px 16px;
  }
  .mobile-menu.active { display: flex; }
  .mobile-menu a { color: var(--text-light); text-decoration: none; padding: 10px 0; font-size: 15px; border-bottom: 1px solid var(--border); transition: color 0.2s var(--ease), background 0.2s var(--ease); }
  .mobile-menu a:last-child { border-bottom: none; }
  .mobile-menu a.active { color: var(--primary-text); font-weight: 600; }
  .mobile-menu a:hover { color: var(--primary-text); background: var(--item-bg, rgba(var(--primary-rgb), 0.06)); }

  .container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

  /* ---------- 页头 ---------- */
  .page-header { text-align: center; margin-bottom: 34px; animation: fadeUp 0.5s var(--ease) both; }
  .page-title {
    font-size: 32px; font-weight: 800; letter-spacing: 0.5px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .page-sub { color: var(--text-light); margin-top: 8px; font-size: 15px; }
  .page-sub b { color: var(--primary-text); }

  /* ---------- 游戏卡片 ---------- */
  .game-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
    gap: 14px; margin-bottom: 26px;
  }
  .game-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
    padding: 20px 14px 16px; text-align: center; cursor: pointer;
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
    box-shadow: var(--card-shadow); position: relative; overflow: hidden;
    animation: fadeUp 0.5s var(--ease) both;
    outline: none;
  }
  .game-card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-2));
    opacity: 0; transition: opacity 0.25s var(--ease);
  }
  .game-card:hover, .game-card:focus-visible {
    transform: translateY(-5px); box-shadow: var(--card-shadow-hover); border-color: rgba(var(--primary-rgb),0.35);
  }
  .game-card:hover::before, .game-card:focus-visible::before { opacity: 1; }
  .game-card.active { border-color: var(--primary-text); box-shadow: 0 0 0 3px rgba(var(--primary-rgb),0.15), var(--card-shadow); }
  .game-card.active::before { opacity: 1; }
  .game-icon {
    width: 58px; height: 58px; margin: 0 auto 12px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; font-size: 30px;
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.12), rgba(var(--primary-2-rgb),0.12));
    transition: transform 0.25s var(--ease);
  }
  .game-card:hover .game-icon { transform: scale(1.1) rotate(-6deg); }
  .game-name { font-weight: 700; font-size: 15px; }
  .game-desc { font-size: 12px; color: var(--text-mute); margin-top: 4px; line-height: 1.5; min-height: 36px; }
  .game-best {
    margin-top: 10px; font-size: 11px; color: var(--text-mute);
    background: var(--item-bg); border-radius: var(--radius-pill); padding: 3px 10px; display: inline-flex; gap: 5px;
  }
  .game-best b { color: var(--primary-text); font-variant-numeric: tabular-nums; }

  /* ---------- 舞台 ---------- */
  .stage {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 22px;
    box-shadow: var(--card-shadow); overflow: hidden;
    display: none; animation: stageIn 0.35s var(--ease) both;
  }
  .stage.open { display: block; }
  @keyframes stageIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .stage-head {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 16px 22px; border-bottom: 1px solid var(--border); flex-wrap: wrap;
    background: linear-gradient(135deg, rgba(var(--primary-rgb),0.05), rgba(var(--primary-2-rgb),0.05));
  }
  .stage-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .stage-title span:first-child { font-size: 24px; }
  .stage-score {
    display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-mute);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 6px 16px;
  }
  .stage-score b { color: var(--primary-text); font-size: 16px; font-variant-numeric: tabular-nums; }
  .stage-body { display: flex; gap: 20px; padding: 22px; }
  .board-wrap {
    flex: 1; min-width: 0; position: relative; border-radius: 16px;
    background: var(--item-bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 380px;
  }
  /* 游戏挂载容器（HTML 中为 <div id="board">，无 class，故用 ID 选择器）
     明确宽度基准：board-wrap 是 flex:1 项，宽度确定；
     子元素（grid-board / canvas）的 100% 与 max-width 才能正确解析，
     否则按内容收缩，记忆卡/扫雷格会坍缩成 0 */
  #board {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%;
  }
  .game-canvas { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); touch-action: none; display: block; }
  body.dark .game-canvas { box-shadow: 0 4px 20px rgba(0,0,0,0.35); }

  /* 覆盖层（开始 / 暂停 / 结束） */
  .board-overlay {
    position: absolute; inset: 0; border-radius: 16px; z-index: 5;
    background: var(--overlay-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 8px;
  }
  body.dark .board-overlay { background: rgba(15,15,26,0.75); }
  body.dark { --overlay-bg: rgba(15,15,26,0.75); }
  .board-overlay.show { display: flex; animation: overlayIn 0.3s var(--ease) both; }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  .board-overlay h2 { font-size: 24px; font-weight: 800; }
  .overlay-score { font-size: 34px; font-weight: 800; color: var(--primary-text); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .overlay-score:empty { display: none; }
  .board-overlay p { color: var(--text-light); font-size: 14px; }

  /* ---------- 按钮 ---------- */
  .btn {
    border: none; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.2s var(--ease); white-space: nowrap;
  }
  .btn:hover:not(:disabled):not(.primary):not(.ghost) { background: var(--item-bg); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: var(--on-accent);
    box-shadow: 0 4px 14px rgba(var(--primary-rgb),0.35);
  }
  .btn.primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(var(--primary-rgb),0.45); }
  .btn.ghost { background: transparent; color: var(--text-light); border: 1px solid var(--border); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--primary-text); color: var(--primary-text); }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- 侧栏 ---------- */
  .stage-side { width: 230px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .tips {
    background: var(--item-bg); border-radius: 14px; padding: 14px 16px;
    font-size: 13px; color: var(--text-light); line-height: 1.9;
  }
  .tips b { color: var(--text); display: block; margin-bottom: 2px; }
  .tips kbd {
    background: var(--card-bg); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 6px; font-size: 11px; font-family: inherit;
    color: var(--text); box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }

  /* ---------- 游戏自定义控件（贪吃蛇速度档位等） ---------- */
  .opt-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .opt-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .opt-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .opt-btn {
    border: 1px solid var(--border); background: transparent; color: var(--text-light);
    border-radius: var(--radius-pill); padding: 5px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.2s var(--ease);
  }
  .opt-btn:hover { border-color: var(--primary-text); color: var(--primary-text); }
  .opt-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border-color: transparent; color: var(--on-accent); font-weight: 600;
  }

  /* ---------- 虚拟方向键 ---------- */
  .dpad {
    display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px);
    gap: 5px; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .dpad-btn {
    border: 1px solid var(--border); background: var(--card-bg); color: var(--primary-text);
    border-radius: 12px; font-size: 17px; cursor: pointer; font-family: inherit;
    transition: all 0.12s var(--ease); box-shadow: var(--card-shadow); touch-action: none;
  }
  .dpad-btn:hover { border-color: var(--primary-text); }
  .dpad-btn:active { transform: scale(0.9); background: var(--item-bg); }
  .dpad-btn[data-dir="up"] { grid-column: 2; grid-row: 1; }
  .dpad-btn[data-dir="left"] { grid-column: 1; grid-row: 2; }
  .dpad-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
  .dpad-btn[data-dir="down"] { grid-column: 2; grid-row: 3; }

  /* ---------- 2048 ---------- */
  .grid-board {
    display: grid; gap: 8px; background: rgba(var(--primary-rgb),0.1);
    border-radius: 12px; padding: 8px; touch-action: none; user-select: none;
    /* 必须给明确宽度：记忆卡/扫雷格的内容不参与布局（span 绝对定位/空单元格），
       1fr 列会坍缩成 0，整板消失 */
    width: min(340px, 100%);
  }
  .grid-board .tile {
    aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 1.05em; background: var(--card-bg); color: var(--text);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: background 0.15s var(--ease);
    font-variant-numeric: tabular-nums;
  }
  .grid-board .tile.pop { animation: tilePop 0.22s var(--ease) both; }
  .grid-board .tile.new { animation: tileNew 0.2s var(--ease) both; }
  .grid-board .tile.merge { animation: tileMerge 0.25s var(--ease) both; }
  @keyframes tilePop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes tileNew { 0% { transform: scale(0.2); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }
  @keyframes tileMerge { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .tile.v2 { background:var(--tile-2); color:var(--tile-text); }
  .tile.v4 { background:var(--tile-4); color:var(--tile-text); }
  .tile.v8 { background:var(--tile-8); color: var(--on-accent); }
  .tile.v16 { background:var(--tile-16); color: var(--on-accent); }
  .tile.v32 { background:var(--tile-32); color: var(--on-accent); }
  .tile.v64 { background:var(--tile-64); color: var(--on-accent); }
  .tile.v128 { background:var(--tile-128); color: var(--on-accent); font-size: 0.9em; }
  .tile.v256 { background:var(--tile-256); color: var(--on-accent); font-size: 0.9em; }
  .tile.v512 { background:var(--tile-512); color: var(--on-accent); font-size: 0.9em; }
  .tile.v1024 { background:var(--tile-1024); color: var(--on-accent); font-size: 0.75em; }
  .tile.v2048 { background:var(--tile-2048); color: var(--on-accent); font-size: 0.75em; box-shadow: var(--tile-2048-glow); }
  .tile.vbig { background:var(--tile-big); color: var(--on-accent); font-size: 0.6em; }

  /* ---------- 记忆翻牌（3D 翻转） ---------- */
  .mem-card {
    aspect-ratio: 1; border-radius: 12px; cursor: pointer; position: relative;
    transform-style: preserve-3d; transition: transform 0.45s var(--ease-spring);
    user-select: none; -webkit-user-select: none;
  }
  .mem-card.flipped, .mem-card.done { transform: rotateY(180deg); }
  .mem-card::before, .mem-card::after {
    content: ""; position: absolute; inset: 0; border-radius: 12px;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .mem-card::before {
    background: var(--grad-brand);
    box-shadow: 0 3px 10px rgba(var(--brand-rgb),0.35);
    content: "?"; color: rgba(255,255,255,0.9); font-size: 24px; font-weight: 800;
  }
  .mem-card::after {
    background: var(--card-bg); border: 1px solid var(--border);
    transform: rotateY(180deg); font-size: 26px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .mem-card.done { opacity: 0.6; }
  .mem-card.done::after { box-shadow: 0 0 0 2px var(--game-green) inset; }
  .mem-card span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; z-index: 1; }
  .mem-card:not(.flipped):not(.done):hover { filter: brightness(1.12); }
  .mem-card:not(.flipped):not(.done):active { filter: brightness(0.95); }

  /* ---------- 扫雷 ---------- */
  .mine-cell {
    aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; cursor: pointer; background: var(--item-bg); color: var(--text);
    border: 1px solid var(--border); user-select: none; -webkit-user-select: none;
    transition: background 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .mine-cell:hover { filter: brightness(0.96); }
  .mine-cell.open { background: var(--card-bg); cursor: default; animation: cellReveal 0.25s var(--ease) both; }
  @keyframes cellReveal { from { transform: scale(0.75); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  .mine-cell.flag { background: rgba(var(--danger-rgb),0.14); animation: flagPop 0.25s var(--ease) both; }
  @keyframes flagPop { 0% { transform: scale(1); } 50% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .mine-cell.boom { background: var(--danger-solid); color: var(--on-accent); animation: boomShake 0.4s var(--ease) both; }
  @keyframes boomShake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-2px,1px); } 50% { transform: translate(2px,-1px); } 75% { transform: translate(-1px,-1px); } }
  .mine-cell.wrong { background: rgba(var(--danger-rgb),0.25); }
  .n1{color:var(--game-blue)}.n2{color:var(--game-green)}.n3{color:var(--danger-solid)}.n4{color:var(--game-purple)}
  .n5{color:var(--game-orange)}.n6{color:var(--game-cyan)}.n7{color:var(--game-gray)}.n8{color:var(--game-gray-light)}

  /* ---------- 闪电靶场（反应类） ---------- */
  .rt-board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    width: min(340px, 100%); touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .rt-cell {
    aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--border);
    background: var(--card-bg); cursor: pointer; position: relative; padding: 0;
    transition: transform 0.12s var(--ease), background 0.12s var(--ease), border-color 0.12s var(--ease);
  }
  .rt-cell:hover { border-color: var(--primary-text); }
  .rt-cell:active { transform: scale(0.94); }
  .rt-cell.target {
    background: var(--grad-brand); border-color: transparent;
    box-shadow: 0 0 0 4px rgba(var(--primary-rgb),0.25), 0 6px 18px rgba(var(--primary-rgb),0.35);
    transform: scale(1.05); animation: rtPulse 0.55s var(--ease) infinite alternate;
  }
  .rt-cell.target::after { content: "🎯"; font-size: 26px; }
  @keyframes rtPulse { from { filter: brightness(1); } to { filter: brightness(1.3); } }
  .rt-cell.hit { background: var(--success); border-color: transparent; animation: rtHit 0.22s var(--ease) both; }
  @keyframes rtHit { 0% { transform: scale(1.2); } 100% { transform: scale(1); } }
  .rt-cell.wrong { background: var(--danger-bg); border-color: var(--danger-solid); animation: rtShake 0.3s var(--ease) both; }
  @keyframes rtShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .rt-cell.expire { background: var(--item-bg); border-color: var(--border); opacity: 0.5; }

  /* ---------- 汉诺塔（策略/休闲） ---------- */
  .hn-board { display: flex; gap: 12px; width: min(430px, 100%); touch-action: manipulation; }
  .hn-rod {
    flex: 1; position: relative; border: none; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 250px; padding: 0 4px 22px; font-family: inherit; color: var(--text);
    border-radius: 12px; transition: background 0.15s var(--ease);
  }
  .hn-rod:hover { background: var(--item-bg); }
  .hn-rod.picked { background: var(--item-bg); box-shadow: inset 0 0 0 2px rgba(var(--primary-rgb),0.4); }
  .hn-pole {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 200px; border-radius: 4px;
    background: linear-gradient(180deg, rgba(var(--primary-rgb),0.4), rgba(var(--primary-rgb),0.12));
  }
  .hn-base {
    position: absolute; bottom: 12px; left: 0; right: 0; height: 10px;
    border-radius: 6px; background: var(--border);
  }
  .hn-disks {
    position: relative; z-index: 1; display: flex; flex-direction: column-reverse;
    align-items: center; gap: 3px; width: 100%;
  }
  .hn-disk {
    height: 20px; border-radius: 10px; color: var(--on-accent); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    transition: transform 0.15s var(--ease-spring);
  }
  .hn-disk.lift { transform: translateY(-14px); box-shadow: 0 8px 16px rgba(0,0,0,0.25); }
  .hn-tag {
    position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
    font-size: 12px; font-weight: 700; color: var(--text-mute);
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 1px 9px; font-variant-numeric: tabular-nums;
  }
  .hn-rod.shake { animation: hnShake 0.4s var(--ease) both; }
  @keyframes hnShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  /* ---------- 排行榜 ---------- */
  .rank-panel {
    margin-top: 26px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 22px; padding: 22px; box-shadow: var(--card-shadow);
  }
  .rank-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .rank-title { font-size: 18px; font-weight: 700; }
  .rank-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .rank-tab {
    border: 1px solid var(--border); background: transparent; color: var(--text-light);
    border-radius: var(--radius-pill); padding: 5px 14px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.2s var(--ease);
  }
  .rank-tab:hover { border-color: var(--primary-text); color: var(--primary-text); }
  .rank-tab.active { background: var(--primary); border-color: var(--primary-text); color: var(--on-accent); }
  .rank-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rank-table th, .rank-table td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
  .rank-table th { font-size: 12px; color: var(--text-mute); font-weight: 600; }
  .rank-table tbody tr { transition: background 0.15s var(--ease); }
  .rank-table tbody tr:hover { background: var(--item-bg); }
  .rank-table td:last-child, .rank-table th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-medal { font-size: 15px; }
  .rank-empty { text-align: center; color: var(--text-mute); padding: 30px 0; font-size: 14px; }

  .footer { text-align: center; padding: 40px 24px; color: var(--text-mute); font-size: 13px; border-top: 1px solid var(--border); }



  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  @media (max-width: 900px) {
    .nav-links { display: none; }
    .nav-toggle { display: flex; }
    .container { padding: 30px 18px; }
    .page-title { font-size: 26px; }
  }
  @media (max-width: 720px) {
    .stage-body { flex-direction: column; }
    .stage-side { width: 100%; }
    .board-wrap { min-height: 320px; }
  }

    /* 可访问性：键盘焦点清晰可见 */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    /* 尊重系统减弱动效偏好：关闭装饰性动画与过渡 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
    /* 交互反馈：按下态（opacity 方案，避免与组件既有 transform 冲突） */
    a:active, button:active, [role="button"]:active,
    .game-card:active, .post-card:active, .link-card:active, .timeline-item:active,
    .rank-tab:active, .tab:active, .opt-btn:active { opacity: 0.85; }
  </style>
</head>

<script>

  try {
    var __t = localStorage.getItem("theme");
    var __dark = __t === "dark" || (!__t && matchMedia("(prefers-color-scheme: dark)").matches);
    if (__dark) {
      document.body.classList.add("dark");
    }
    // 主题色同步：移动端地址栏/状态栏颜色与首屏主题一致（后续手动切换由 common.js 接管）
    var __tc = document.querySelector('meta[name="theme-color"]:not([media])');
    if (__tc) __tc.setAttribute("content", __dark ? "#0f0f1a" : "#4f46e5");
  } catch (e) {}
</script>
